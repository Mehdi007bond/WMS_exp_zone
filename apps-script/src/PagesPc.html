          var per = sm.dateMin ? (sm.dateMin === sm.dateMax ? f.date(sm.dateMin) : f.date(sm.dateMin) + ' → ' + f.date(sm.dateMax)) : '';
          // Short format in the card; the full format line is shown above the analysis.
          var fm = sm.format || {};
          info = '<span class="ok-t">✓ MB51 reconnu' + (fm.columns ? ' · ' + f.plural(fm.columns, 'colonne', 'colonnes') : '') + '</span>' +
            '<span>en-tête ligne ' + (r.headerRow + 1) + (x.sheet ? ' · feuille « ' + esc(x.sheet) + ' »' : '') + '</span>' +
            '<span>' + f.plural(sm.read || 0, 'ligne lue', 'lignes lues') + ' · ' + f.plural(sm.valid, 'valide', 'valides') +
            (sm.untracked ? ' · ' + num(sm.untracked) + ' hors produits finis' : '') +
            (sm.rejected ? ' · <b class="bad-t">' + f.plural(sm.rejected, 'rejetée', 'rejetées') + '</b>' : '') + '</span>' +
            (per ? '<span>' + esc(per) + '</span>' : '');
        } else info = '<span>' + f.plural(x.rows ? x.rows.length : 0, 'ligne', 'lignes') + '</span>';
        return '<div class="file ' + (r && !r.ok ? 'err' : cls) + '"><b>' + esc(x.name) + '</b><span>' + esc(f.num(Math.round(x.size / 1024), 0)) + ' Ko</span>' + info +
          (sending ? '' : '<div><button type="button" class="btn" data-del="' + i + '" aria-label="Retirer ' + esc(x.name) + '">Retirer</button></div>') + '</div>';
      }).join('');
      App.$$('[data-del]', R.files).forEach(function (b) {
        b.addEventListener('click', function () {
          files.splice(Number(b.getAttribute('data-del')), 1);
          analyse();
        });
      });
    }

    function addFiles(list) {
      if (sending) return;
      result = null;
      R.result.innerHTML = '';
      Array.prototype.forEach.call(list || [], function (file) {
        var x = { file: file, name: file.name, size: file.size, status: 'reading', rows: null, sheet: '', error: '' };
        files.push(x);
        parse(x);
      });
      renderFiles();
    }

    function parse(x) {
      var text = isTextFile(x.name);
      if (!text && !window.XLSX) {
        x.status = libState === 'error' ? 'error' : 'waitlib';
        if (x.status === 'error') x.error = 'Fichier Excel illisible sans la bibliothèque SheetJS : exportez-le en texte avec tabulations ou en CSV.';
        renderFiles();
        return;
      }
      x.status = 'reading';
      readFileBuffer(x.file).then(function (buf) {
        if (text) {
          x.rows = Norm.textToRows(decodeText(buf));
        } else {
          var wb = window.XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: false, dense: false });
          var pickName = wb.SheetNames[0], rows = null;
          for (var i = 0; i < wb.SheetNames.length; i++) {
            var rr = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], Norm.SHEETJS_OPTIONS || { header: 1, raw: true, defval: null, blankrows: true });
            if (Norm.detectHeaderRow(rr) >= 0) {
              pickName = wb.SheetNames[i];
              rows = rr;
              break;
            }
            if (!rows) rows = rr;
          }
          x.rows = rows || [];
          x.sheet = wb.SheetNames.length > 1 ? pickName : '';
        }
        x.status = 'ok';
      }).catch(function (err) {
        x.status = 'error';
        x.error = 'Fichier illisible : ' + (err && err.message ? err.message : String(err));
      }).then(function () {
        if (!gone) analyse();
      });
    }

    // Normalises every readable file with the same Norm code as the server (header synonyms, numbers, dates, entry
    // times, labels, duplicates inside the batch, 311/312 legs that do not cancel out), then the finished-goods
    // filter (docs/SPEC_V2.md 2.4): articles of state.articles or with a line in EXP2 in the files.
    function analyse() {
      var ready = files.filter(function (x) { return x.status === 'ok'; });
      var waiting = files.some(function (x) { return x.status === 'reading' || x.status === 'waitlib'; });
      batch = null;
      if (ready.length && !waiting) {
        ready.forEach(function (x, i) { x.batchIndex = i; });
        try {
          batch = Norm.normalizeBatch(ready.map(function (x) { return { name: x.name, rows: x.rows }; }), {
            plant: App.CFG.PLANT || 'TA11', trackedOnly: trackedOnly(), tracked: trackedCodes()
          });
        } catch (e) {
          batch = null;
          R.preview.innerHTML = '<div class="alert-box">Analyse impossible : ' + esc(e.message) + '</div>';
          renderFiles();
          return;
        }
      }
      renderFiles();
      renderPreview(waiting);
    }

    function flagLabel(code) {
      return { TRANSFERT_ORPHELIN: 'Transfert orphelin (311/312 sans ligne opposée)', ANTIDATE: 'Saisie antidatée' }[code] || code;
    }

    function renderPreview(waiting) {
      if (!batch) {
        R.preview.innerHTML = waiting ? '<div class="panel"><p class="muted"><span class="spinner"></span> Lecture des fichiers…</p></div>' : '';
        return;
      }
      var S = batch.summary;
      var lines = batch.lines || [];
      var kept = lines.length + (batch.duplicates || []).length;
      var formats = batch.files.filter(function (r) { return r.ok && r.summary && r.summary.format; }).map(function (r) {
        return (batch.files.length > 1 ? r.file + ' : ' : '') + formatLine(r.summary.format);
      });
      var filterText = batch.trackedOnly ?
        num(kept) + ' ' + (kept > 1 ? 'lignes gardées' : 'ligne gardée') + ' (produits finis) · ' + num(batch.untracked.lines) + ' ' + (batch.untracked.lines > 1 ? 'ignorées' : 'ignorée') +
          ' (' + f.plural(batch.untracked.articles, 'article', 'articles') + ' hors produits finis)' :
        'Filtre produits finis désactivé : ' + f.plural(kept, 'ligne valide importée', 'lignes valides importées') + ', tous articles confondus';
      var html = '<div class="import-sum"><div data-r="format">' + formats.map(function (t) { return '<div>' + esc(t) + '</div>'; }).join('') + '</div>' +
        '<div data-r="filter" class="' + (batch.trackedOnly ? '' : 'warn-t') + '">' + esc(filterText) + '</div></div>';
      html += '<div class="row2"><div class="panel"><h2>Résultat de l’analyse<small>rien n’est encore enregistré</small></h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fichier</th><th>Période</th><th class="num">Lues</th><th class="num">Valides</th><th class="num">Hors PF</th><th class="num">Doublons</th><th class="num">Rejetées</th><th class="num">Ignorées</th><th class="num">Alertes</th></tr></thead><tbody>' +
        batch.files.map(function (r) {
          var s = r.summary || {};
          var period = s.dateMin ? (s.dateMin === s.dateMax ? f.date(s.dateMin) : f.date(s.dateMin) + ' → ' + f.date(s.dateMax)) : '—';
          return '<tr><td>' + esc(r.file) + (r.ok ? '' : '<span class="sub bad-t">' + esc(r.error) + '</span>') + '</td><td>' + esc(period) + '</td><td class="num">' + num(s.read) +
            '</td><td class="num">' + num(s.valid) + '</td><td class="num">' + num(r.untracked ? r.untracked.length : 0) + '</td><td class="num">' + num(r.duplicates ? r.duplicates.length : 0) +
            '</td><td class="num">' + num(s.rejected) + '</td><td class="num">' + num(s.skipped ? s.skipped.total : 0) + '</td><td class="num">' + num(s.flags) + '</td></tr>';
        }).join('') +
        '<tr><td><b>Total</b></td><td>' + esc(S.dateMin ? f.date(S.dateMin) + ' → ' + f.date(S.dateMax) : '—') + '</td><td class="num"><b>' + num(S.read) + '</b></td><td class="num"><b>' + num(S.valid) +
        '</b></td><td class="num">' + num(batch.untracked.lines) + '</td><td class="num">' + num((batch.duplicates || []).length) + '</td><td class="num">' + num(S.rejected) + '</td><td class="num">' + num(S.skipped.total) +
        '</td><td class="num">' + num(S.flags) + '</td></tr>' +
        '</tbody></table></div>' +
        '<div class="panel-note">Hors PF : lignes d’articles qui ne passent pas par EXP2 (composants, matières), ignorées. Les lignes déjà présentes dans la base sont reconnues par le serveur et ignorées : réimporter un fichier est sans risque.</div>' +
        '<div class="actions"><button type="button" class="btn p lg" data-save' + (lines.length && !sending ? '' : ' disabled') + '>Enregistrer dans la base (' + f.plural(lines.length, 'ligne', 'lignes') + ')</button>' +
        '<button type="button" class="btn" data-clear' + (sending ? ' disabled' : '') + '>Tout retirer</button></div>' +
        '<div data-r="progress"></div></div>';
      // Checks
      var checks = [];
      var bad = batch.files.filter(function (r) { return !r.ok; });
      checks.push(bad.length ? { l: 'c', t: f.plural(bad.length, 'fichier non reconnu', 'fichiers non reconnus') + ' : ' + bad.map(function (r) { return esc(r.error); }).join(' ') }
        : { l: '', t: 'Colonnes MB51 reconnues dans ' + f.plural(batch.files.length, 'fichier', 'fichiers') + ' (Article, Magasin, MvT, Doc.article, Date cpt., Qté).' });
      var noTime = batch.files.filter(function (r) { return r.ok && r.summary && r.summary.format && !r.summary.format.hasTime; });
      if (noTime.length) checks.push({ l: 'w', t: 'Sans « Heure de saisie » : les attentes en PRD2 seront comptées en jours, pas en heures. Ajoutez la colonne à la mise en forme de la liste MB51.' });
      checks.push(S.rejected ? { l: 'w', t: f.plural(S.rejected, 'ligne rejetée', 'lignes rejetées') + ' (autre division que ' + esc(App.CFG.PLANT || 'TA11') + ', valeur illisible) : détail ci-dessous.' }
        : { l: '', t: 'Aucune ligne rejetée (division ' + esc(App.CFG.PLANT || 'TA11') + ', dates et quantités lisibles).' });
      checks.push(S.skipped.total ? { l: '', t: f.plural(S.skipped.total, 'ligne ignorée', 'lignes ignorées') + ' : sous-totaux, en-têtes répétés, lignes vides.' } : null);
      checks.push((batch.duplicates || []).length ? { l: '', t: f.plural(batch.duplicates.length, 'ligne en double', 'lignes en double') + ' entre les fichiers déposés : comptée(s) une seule fois.' } : null);
      var codes = S.flagCodes || {};
      Object.keys(codes).forEach(function (c) {
        checks.push({ l: 'w', t: f.plural(codes[c], 'ligne', 'lignes') + ' : ' + esc(flagLabel(c)) + '. Lignes acceptées, à vérifier.' });
      });
      checks.push({ l: '', t: f.plural(S.auto, 'saisie automatique', 'saisies automatiques') + ' (Auto) · ' + f.plural(S.manual, 'saisie manuelle', 'saisies manuelles') + ' (Manuel).' });
      (S.warnings || []).forEach(function (w) { checks.push({ l: 'w', t: esc(w) }); });
      html += '<div class="panel"><h2>Contrôles</h2><div class="checks">' + checks.filter(Boolean).map(function (c) {
        return '<div class="check"><span class="ic ' + c.l + '">' + (c.l ? '!' : '✓') + '</span><span>' + c.t + '</span></div>';
      }).join('') + '</div></div></div>';
      // Details
      if (batch.rejected && batch.rejected.length) {
        html += '<div class="panel"><h2>Lignes rejetées<small>' + f.plural(batch.rejected.length, 'ligne', 'lignes') + '</small></h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fichier</th><th class="num">Ligne</th><th>Doc.article</th><th>Article</th><th>Raison</th></tr></thead><tbody>' +
          batch.rejected.slice(0, 100).map(function (r) {
            return '<tr><td>' + esc(r.file || '') + '</td><td class="num">' + num(r.row) + '</td><td class="mono">' + esc(r.doc || '') + '</td><td class="mono">' + esc(r.article || '') + '</td><td>' + esc(r.reason) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }
      if (batch.flags && batch.flags.length) {
        html += '<div class="panel"><h2>Alertes<small>lignes acceptées</small></h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fichier</th><th class="num">Ligne</th><th>Contrôle</th><th>Détail</th></tr></thead><tbody>' +
          batch.flags.slice(0, 100).map(function (r) {
            return '<tr><td>' + esc(r.file || '') + '</td><td class="num">' + num(r.row) + '</td><td>' + esc(flagLabel(r.code)) + '</td><td>' + esc(r.text) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }
      if (lines.length) {
        var anyTs = lines.some(function (l) { return l.ts; }), anyLabel = lines.some(function (l) { return l.label; });
        html += '<div class="panel"><h2>Aperçu des lignes<small>' + (lines.length > 20 ? '20 premières sur ' + num(lines.length) : f.plural(lines.length, 'ligne', 'lignes')) + '</small></h2>' +
          '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + (anyTs ? 'Saisie le' : 'Date cpt.') + '</th><th>Article</th><th>Désignation</th><th>Mag.</th><th>MvT</th><th>Doc.article</th>' +
          (anyLabel ? '<th>Étiquette</th>' : '') + '<th class="num">Qté</th><th>UQS</th><th>Saisie</th></tr></thead><tbody>' +
          lines.slice(0, 20).map(function (l) {
            return '<tr><td>' + esc(l.ts ? f.stamp(l.ts) : f.date(l.date)) + '</td><td class="mono">' + esc(l.article) + '</td><td>' + esc(l.designation || '') + '</td><td>' + esc(l.magasin) + '</td><td class="mono">' + esc(l.mvt) +
              '</td><td class="mono">' + esc(l.doc) + '</td>' + (anyLabel ? '<td class="mono">' + esc(l.label || '') + '</td>' : '') + '<td class="num">' + num(l.qty, undefined) + '</td><td>' + esc(l.uqs || '') + '</td><td>' + esc(Norm.userKind ? Norm.userKind(l.user) : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }
      R.preview.innerHTML = html;
      var save = App.$('[data-save]', R.preview);
      if (save) save.addEventListener('click', send);
      var clear = App.$('[data-clear]', R.preview);
      if (clear) clear.addEventListener('click', function () {
        files = [];
        batch = null;
        R.preview.innerHTML = '';
        renderFiles();
      });
    }

    function progress(done, total, text) {
      var box = App.$('[data-r="progress"]', R.preview);
      if (!box) return;
      box.innerHTML = '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done + '"><i style="width:' +
        (total ? Math.round(done / total * 100) : 0) + '%"></i></div><div class="small">' + text + '</div>';
    }

    // The 6 h alert right after the import: « 86 palettes en PRD2 depuis plus de 6 h (la plus ancienne : 44 h 02) ».
    function prd2Box(sum) {
      if (!sum || !(Number(sum.pendingCrit) > 0)) return '';
      var h = isNum(sum.pendingHoursCrit) ? App.hText(sum.pendingHoursCrit) : '6';
      return '<div class="alert-box" data-r="prd2"><b>' + f.plural(sum.pendingCrit, 'palette', 'palettes') + ' en PRD2 depuis plus de ' + esc(h) + ' h</b>' +
        (isNum(sum.oldestPendingHours) ? ' (la plus ancienne : ' + esc(f.hm(sum.oldestPendingHours)) + ')' : '') +
        ' : déclarées en production, pas encore transférées en EXP2. Détail par étiquette : page <b>En attente</b>.</div>';
    }

    function send() {
      if (!batch || sending) return;
      var chunks = [];
      batch.files.forEach(function (r) {
        var fresh = r.fresh || [];
        var s = r.summary || {};
        for (var i = 0; i < fresh.length; i += CHUNK) {
          chunks.push({
            file: r.file,
            period: s.dateMin ? (s.dateMin === s.dateMax ? f.date(s.dateMin) : 'du ' + f.date(s.dateMin) + ' au ' + f.date(s.dateMax)) : '',
            lines: fresh.slice(i, i + CHUNK).map(function (l) {
              var o = {};
              LINE_FIELDS.forEach(function (k) {
                if (l[k] !== undefined) o[k] = l[k];
              });
              return o;
            })
          });
        }
      });
      if (!chunks.length) return;
      var total = chunks.reduce(function (a, c) { return a + c.lines.length; }, 0);
      var importId = 'IMP-' + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14) + '-' + Math.floor(Math.random() * 1e4);
      var S = batch.summary;
      var period = S.dateMin ? (S.dateMin === S.dateMax ? f.date(S.dateMin) : 'du ' + f.date(S.dateMin) + ' au ' + f.date(S.dateMax)) : '';
      var untracked = batch.trackedOnly ? batch.untracked : null;
      sending = true;
      renderFiles();
      var save = App.$('[data-save]', R.preview), clear = App.$('[data-clear]', R.preview);
      if (save) save.disabled = true;
      if (clear) clear.disabled = true;
      R.all.disabled = true;
      progress(0, total, 'Envoi en cours…');
      var started = Date.now();
      App.withKey('admin', function (key) {
        var sent = 0, last = null;
        var p = Promise.resolve();
        chunks.forEach(function (c, i) {
          p = p.then(function () {
            var final = i === chunks.length - 1;
            progress(sent, total, 'Lot ' + (i + 1) + ' / ' + chunks.length + ' · ' + num(sent) + ' / ' + num(total) + ' lignes envoyées' +
              (final ? ' · recalcul de l’entrepôt…' : '…'));
            var meta = { importId: importId, fileName: c.file, kind: 'MB51', period: final ? period : c.period, final: final, alerts: (batch.flags || []).length,
              untracked: untracked ? untracked.lines : null };
            return App.call('api_importLines', key, meta, c.lines).then(function (res) {
              sent += c.lines.length;
              last = res;
            }, function (err) {
              if (App.isKeyError(err) && i === 0) throw err;
              var e = new Error('Lot ' + (i + 1) + ' / ' + chunks.length + ' : ' + err.message + ' · Les lots déjà envoyés sont enregistrés ; relancer l’import est sans risque (les lignes connues sont ignorées).');
              throw e;
            });
          });
        });
        return p.then(function () { return last; });
      }).then(function (res) {
        sending = false;
        R.all.disabled = false;
        result = res;
        var ms = Date.now() - started;
        var t = res && res.totals ? res.totals : { added: res ? res.added : 0, duplicates: res ? res.duplicates : 0, rejected: res ? res.rejected : 0 };
        var names = files.map(function (x) { return x.name; });
        // The analysis (« rien n’est encore enregistré ») is gone: the saved result is at the top, in view.
        files = [];
        batch = null;
        R.preview.innerHTML = '';
        R.result.innerHTML = '<div class="panel"><h2>Import enregistré<small>' + esc(names.join(', ')) + '</small></h2>' +
          '<p><b>Enregistré : ' + f.plural(t.added, 'nouvelle ligne', 'nouvelles lignes') + ', ' + f.plural(t.duplicates, 'déjà connue', 'déjà connues') +
          (t.rejected ? ', ' + f.plural(t.rejected, 'rejetée', 'rejetées') : '') + '.</b> ' +
          (untracked && untracked.lines ? num(untracked.lines) + ' lignes hors produits finis non importées. ' : '') +
          (ms < 1000 ? 'Enregistré en moins d’une seconde.' : 'Enregistré en ' + esc(f.duration(ms)) + '.') + '</p>' +
          (res && res.warning ? '<div class="alert-box">' + esc(res.warning) + '</div>' : '') +
          prd2Box(res && res.summary) +
          '<div class="stats">' +
          stat('Nouvelles lignes', num(t.added), 'ajoutées à la base') +
          stat('Déjà connues', num(t.duplicates), 'ignorées (doublons)') +
          stat('Rejetées par le serveur', num(t.rejected), 'contrôle serveur') +
          stat('État recalculé', res && res.summary ? num(res.summary.exp2Pallets) + ' <small>pal EXP2</small>' : '—',
            res && res.summary ? 'au ' + esc(res.summary.asOfTs ? f.stamp(res.summary.asOfTs) : f.date(res.summary.asOf)) : '') +
          '</div><p class="small">' + esc((res && res.message) || '') + '</p>' +
          '<div class="actions"><button type="button" class="btn" data-go="pending">En attente</button><button type="button" class="btn" data-go="projects">Projets</button>' +
          '<button type="button" class="btn" data-go="lookup">Recherche article</button><button type="button" class="btn" data-go="plan">Plan 2D</button><button type="button" class="btn" data-new>Nouvel import</button></div></div>';
        App.$$('[data-go]', R.result).forEach(function (b) {
          b.addEventListener('click', function () { App.go(b.getAttribute('data-go'), {}); });
        });
        App.$('[data-new]', R.result).addEventListener('click', function () {
          files = [];
          batch = null;
          result = null;
          R.preview.innerHTML = '';
          R.result.innerHTML = '';
          renderFiles();
          if (R.drop.scrollIntoView) R.drop.scrollIntoView({ block: 'center' });
        });
        if (R.result.scrollIntoView) R.result.scrollIntoView({ behavior: 'smooth', block: 'start' });
        App.toast((res && res.message) || 'Import enregistré.', 'ok');
        if (res && res.warning) App.toast(res.warning, 'warn', 12000);
        renderFiles();
        App.refresh(true);
      }, function (err) {
        sending = false;
        R.all.disabled = false;
        renderFiles();
        if (save) save.disabled = false;
        if (clear) clear.disabled = false;
        if (err && err.cancelled) {
          progress(0, total, 'Envoi annulé : rien n’a été enregistré.');
          return;
        }
        progress(0, total, '<span class="bad-t">Échec : ' + esc(err.message) + '</span>');
        App.toast('Import interrompu : ' + err.message, 'error');
      });
    }

    var input = R.input, drop = R.drop;
    input.addEventListener('change', function () {
      addFiles(input.files);
      input.value = '';
    });
    drop.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        input.click();
      }
    });
    ['dragenter', 'dragover'].forEach(function (t) {
      drop.addEventListener(t, function (ev) {
        ev.preventDefault();
        drop.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      drop.addEventListener(t, function (ev) {
        ev.preventDefault();
        drop.classList.remove('over');
      });
    });
    drop.addEventListener('drop', function (ev) {
      if (ev.dataTransfer && ev.dataTransfer.files) addFiles(ev.dataTransfer.files);
    });
    // Dropping a file anywhere else must not navigate away from the app.
    function block(ev) {
      if (ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0) ev.preventDefault();
    }
    window.addEventListener('dragover', block);
    window.addEventListener('drop', block);
    libLine();

    // Real SAP files must not be mixed with the simulated base: say so before anything is dropped.
    function simWarn(store) {
      var sim = !!(store.state && store.state.source === 'SIMULATION' && store.status === 'ok');
      R.simwarn.innerHTML = sim ? '<div class="alert-box">La base contient des données simulées. Avant d’importer de vraies extractions SAP : ' +
        'menu <b>EXP2 Jumeau › Simulation › Effacer la simulation</b> dans le classeur.</div>' : '';
    }

    return {
      update: function (store) {
        simWarn(store);
        syncAllBox(store);
      },
      destroy: function () {
        gone = true;
        window.removeEventListener('dragover', block);
        window.removeEventListener('drop', block);
      }
    };
  };

  // ---------------------------------------------------------------------------------------------------------------
  // Simulation
  // ---------------------------------------------------------------------------------------------------------------
  P.simulation = function (el) {
    var busy = false, lastMsg = null, shown;
    var SimMod = typeof Sim !== 'undefined' && Sim && Sim.generate ? Sim : null;
    var D = (SimMod && SimMod.DEFAULTS) || { days: 7, palletsPerDay: 450, seed: 2026 };
    var LIM = (SimMod && SimMod.LIMITS) || { days: [1, 60], palletsPerDay: [20, 1500] };
    el.innerHTML = '<div class="page-head"><h1>Simulation</h1><p>Données fictives au format réel de l’export MB51, pour les démonstrations. Les actions demandent la clé administrateur.</p></div>' +
      '<div class="sim-actions">' +
      '<div class="sim-card"><h3>Générer la simulation</h3><p>Remplace les données simulées (les lignes importées de SAP sont conservées) par des journées réalistes se terminant hier (l’usine tourne 7 jours sur 7).</p>' +
      '<div class="inline"><label class="field"><span>Jours</span><input type="number" data-r="days" min="' + LIM.days[0] + '" max="' + LIM.days[1] + '" value="' + D.days + '"></label>' +
      '<label class="field wide" title="Étiquettes déclarées par jour : 1 étiquette = 1 palette"><span>Étiquettes par jour</span><input type="number" data-r="ppd" min="' + LIM.palletsPerDay[0] +
      '" max="' + LIM.palletsPerDay[1] + '" step="10" placeholder="auto (' + D.palletsPerDay + ')"></label></div>' +
      '<details class="adv"><summary>Options avancées</summary><div class="inline">' +
      '<label class="field" title="Même numéro = mêmes données simulées"><span>Variante (n°)</span><input type="number" data-r="seed" min="0" value="' + (D.seed || 2026) + '"></label></div></details>' +
      '<div><button type="button" class="btn p lg" data-act="simulate">Générer ' + D.days + ' jours</button></div></div>' +
      '<div class="sim-card"><h3>+1 jour</h3><p>Ajoute la journée suivante à la simulation en cours (déclarations, transferts, sorties, quais).</p>' +
      '<div><button type="button" class="btn lg" data-act="next">Simuler +1 jour</button></div></div>' +
      '<div class="sim-card"><h3>Recalculer</h3><p>Relit les onglets du classeur (ARTICLES, PROJETS, LAYOUT, règles, seuils) et recalcule l’état de l’entrepôt.</p>' +
      '<div><button type="button" class="btn lg" data-act="recompute">Recalculer</button></div></div>' +
      '<div class="sim-card"><h3>MB51 simulé</h3><p>Fichier Excel au format réel de l’export MB51 (22 colonnes, heures de saisie, étiquettes), avec des lignes hors produits finis que l’import doit ignorer : ' +
      'pour essayer la page Import. Mêmes réglages que la génération ; rien n’est enregistré.</p>' +
      '<div><button type="button" class="btn lg" data-dl>Télécharger un MB51 simulé (.xlsx)</button></div><div class="small" data-r="dlMsg" aria-live="polite"></div></div>' +
      '</div><div data-r="msg" aria-live="polite"></div><div data-r="status"></div>';
    var R = {};
    App.$$('[data-r]', el).forEach(function (e) { R[e.getAttribute('data-r')] = e; });
    var simBtn = App.$('[data-act="simulate"]', el);
    R.days.addEventListener('input', function () {
      var d = Math.round(Number(R.days.value));
      simBtn.textContent = 'Générer ' + (d > 0 ? d : D.days) + (d === 1 ? ' jour' : ' jours');
    });

    // Form values checked against Sim.LIMITS: { days, palletsPerDay (undefined = auto), seed } or { error }.
    function params() {
      var days = R.days.value === '' ? D.days : Number(R.days.value);
      if (!isFinite(days) || Math.floor(days) !== days || days < LIM.days[0] || days > LIM.days[1]) return { error: 'Jours : nombre entier de ' + LIM.days[0] + ' à ' + LIM.days[1] + '.' };
      var ppd;
      if (R.ppd.value !== '') {
        ppd = Number(R.ppd.value);
        if (!isFinite(ppd) || Math.floor(ppd) !== ppd || ppd < LIM.palletsPerDay[0] || ppd > LIM.palletsPerDay[1]) {
          return { error: 'Étiquettes par jour : nombre entier de ' + num(LIM.palletsPerDay[0]) + ' à ' + num(LIM.palletsPerDay[1]) + ' (vide = automatique).' };
        }
      }
      var seed = R.seed.value === '' ? undefined : Number(R.seed.value);
      if (seed !== undefined && (!isFinite(seed) || seed < 0)) return { error: 'Variante : nombre positif.' };
      return { days: days, palletsPerDay: ppd, seed: seed };
    }

    function setBusy(b, text) {
      busy = b;
      App.$$('[data-act], [data-dl]', el).forEach(function (x) { x.disabled = b; });
      if (b) R.msg.innerHTML = '<div class="info-box"><span class="spinner"></span> ' + esc(text) + '</div>';
    }

    function run(kind) {
      if (busy) return;
      var labels = { simulate: 'Génération de la simulation en cours (jusqu’à une minute)…', next: 'Simulation de la journée suivante…', recompute: 'Recalcul en cours…' };
      var p = kind === 'simulate' ? params() : {};
      if (p.error) {
        lastMsg = { ok: false, text: p.error };
        renderMsg();
        return;
      }
      var go = function () {
        setBusy(true, labels[kind]);
        App.withKey('admin', function (key) {
          if (kind === 'simulate') {
            var q = { days: p.days, seed: p.seed };
            if (p.palletsPerDay !== undefined) q.palletsPerDay = p.palletsPerDay;
            return App.call('api_simulate', key, q);
          }
          if (kind === 'next') return App.call('api_simulateNextDay', key);
          return App.call('api_recompute', key);
        }).then(function (res) {
          setBusy(false);
          lastMsg = { ok: true, text: (res && res.message) || 'Terminé.' };
          renderMsg();
          App.toast(lastMsg.text, 'ok');
          App.refresh(true);
        }, function (err) {
          setBusy(false);
          lastMsg = err && err.cancelled ? null : { ok: false, text: err.message };
          renderMsg();
        });
      };
      var s = App.store.state;
      if (kind === 'simulate' && s && !App.isEmpty(s)) {
        var m = App.modal({
          title: 'Remplacer la simulation ?',
          body: '<p>Les données simulées actuelles (mouvements, stock initial, articles, projets et quais simulés) seront remplacées. Les lignes importées de SAP sont conservées.</p>',
          actions: [{ label: 'Annuler', kind: 'ghost', value: null }, { label: 'Générer', kind: 'primary', value: 'go' }]
        });
        m.done.then(function (v) { if (v === 'go') go(); });
        return;
      }
      go();
    }
    App.$$('[data-act]', el).forEach(function (b) {
      b.addEventListener('click', function () { run(b.getAttribute('data-act')); });
    });

    // MB51 file generated in the browser (Sim.generate + Sim.mb51Rows with noise), written with SheetJS.
    function download() {
      if (busy) return;
      var p = params();
      if (p.error) {
        R.dlMsg.innerHTML = '<span class="bad-t">' + esc(p.error) + '</span>';
        return;
      }
      if (!SimMod || !SimMod.mb51Rows) {
        R.dlMsg.innerHTML = '<span class="bad-t">Simulateur absent de la page : mettez à jour le script Apps Script (Index.html) et redéployez.</span>';
        return;
      }
      R.dlMsg.innerHTML = '<span class="spinner"></span> Préparation du fichier…';
      setBusy(true, 'Préparation du fichier MB51 simulé…');
      loadSheetJs().then(function (XLSX) {
        var end = new Date();
        end.setDate(end.getDate() - 1);
        var endIso = end.getFullYear() + '-' + ('0' + (end.getMonth() + 1)).slice(-2) + '-' + ('0' + end.getDate()).slice(-2);
        var s = App.store.state;
        var opts = { days: p.days, endDate: endIso, seed: p.seed === undefined ? D.seed : p.seed };
        if (p.palletsPerDay !== undefined) opts.palletsPerDay = p.palletsPerDay;
        var layoutBlocks = s && s.layout && s.layout.blocks;
        if (layoutBlocks && layoutBlocks.length) opts.blocks = layoutBlocks;
        var gen = SimMod.generate(opts);
        var rows = SimMod.mb51Rows(gen.movements, { noise: true, seed: opts.seed });
        var ws = XLSX.utils.aoa_to_sheet(rows);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'MB51');
        var name = 'MB51_simule_' + gen.params.startDate + '_' + gen.params.endDate + '.xlsx';
        XLSX.writeFile(wb, name);
        setBusy(false);
        lastMsg = null;
        renderMsg();
        R.dlMsg.innerHTML = '<span class="ok-t">✓</span> ' + esc(name) + ' · ' + f.plural(rows.length - 1, 'ligne', 'lignes') + ' (dont des lignes hors produits finis). Déposez-le sur la page Import.';
      }).catch(function (err) {
        setBusy(false);
        renderMsg();
        R.dlMsg.innerHTML = '<span class="bad-t">Fichier non créé : ' + esc(err && err.message ? err.message : String(err)) + '</span>';
      });
    }
    App.$('[data-dl]', el).addEventListener('click', download);

    function renderMsg() {
      R.msg.innerHTML = lastMsg ? '<div class="' + (lastMsg.ok ? 'info-box' : 'alert-box') + '">' + esc(lastMsg.text) + '</div>' : '';
    }

    function status(store) {
      var s = store.state;
      if (!s) {
        R.status.innerHTML = store.status === 'loading' ? '' : '<div class="panel"><h2>État actuel</h2><p class="muted">' +
          esc(store.status === 'notInstalled' ? bodyMessage(store.message) : store.status === 'error' ? store.message : 'Aucune donnée.') + '</p></div>';
        return;
      }
      var k = s.kpi || {}, thr = App.thresholds(s), fr = App.freshness(s);
      var alerts = s.alerts || [];
      var debug = !!(App.location && App.location.parameter && App.location.parameter.debug === '1');   // ?debug=1: versions, timing
      var waits = isNum(k.oldestPendingHours) ? 'plus ancienne ' + f.hm(App.oldestWaitHours(s)) + (Number(k.pendingCrit) > 0 ? ' · ' + num(k.pendingCrit) + ' pal depuis plus de ' + App.hText(thr.pendingHoursCrit) + ' h' : '')
        : 'plus ancienne ' + f.days(k.oldestPendingDays);
      R.status.innerHTML = '<div class="row2"><div class="panel"><h2>État actuel</h2><dl class="kv">' +
        '<dt>Source</dt><dd>' + (App.isEmpty(s) ? 'Aucune donnée' : s.source === 'SIMULATION' ? '<span class="tag sim">DONNÉES SIMULÉES</span>' : 'SAP (imports MB51)') + '</dd>' +
        '<dt>Données jusqu’au</dt><dd>' + esc(fr.asOfLabel) + '</dd>' +
        '<dt>Dernier import / simulation</dt><dd>' + esc(s.importedAt ? f.dateTime(s.importedAt) + ' (' + fr.ago + ')' : '—') + '</dd>' +
        '<dt>Calculé le</dt><dd>' + esc(f.dateTime(s.computedAt)) + (debug && s.stats && s.stats.computeMs ? ' · ' + f.num(s.stats.computeMs / 1000, 1) + ' s' : '') + '</dd>' +
        (debug ? '<dt>Version</dt><dd>données ' + esc(s.version) + ' · quais ' + esc(s.docksVersion === undefined ? '—' : s.docksVersion) + '</dd>' : '') +
        '<dt>Lignes MB51</dt><dd>' + (s.stats ? num(s.stats.movements) : '—') + '</dd>' +
        '<dt>Palettes EXP2</dt><dd>' + num(k.exp2Pallets) + ' / ' + num(k.capacity) + ' · <span class="chipd ' + App.satLevel(k.saturation, thr) + '">' + f.pct(k.saturation) + '</span></dd>' +
        '<dt>En attente PRD2</dt><dd>' + num(k.pendingPallets) + ' pal · ' + esc(waits) + '</dd>' +
        '<dt>EMRT</dt><dd>' + num(k.emrtPallets) + ' pal</dd>' +
        (isNum(k.projects) ? '<dt>Projets</dt><dd>' + num(k.projects) + (Number(k.noProjectArticles) ? ' · ' + f.plural(k.noProjectArticles, 'référence', 'références') + ' sans projet' : '') + '</dd>' : '') +
        '<dt>Quais occupés</dt><dd>' + num(k.docksOccupied) + ' / ' + num(k.docksTotal) + '</dd>' +
        '</dl></div><div class="panel"><h2>Alertes<small>' + f.plural(alerts.length, 'alerte', 'alertes') + '</small></h2>' +
        (alerts.length ? '<ul class="alerts-list">' + alerts.slice(0, 12).map(function (a) {
          return '<li class="' + (a.level === 'crit' ? 'crit' : '') + '">' + esc(a.text) + '</li>';
        }).join('') + '</ul>' + (alerts.length > 12 ? '<div class="panel-note">… et ' + (alerts.length - 12) + ' autres.</div>' : '') : '<p class="muted">Aucune alerte.</p>') +
        '</div></div>';
    }

    return {
      update: function (store) {
        if (store.state === shown && !store.changed && store.state) return;
        shown = store.state;
        status(store);
      }
    };
  };

  window.PagesPc = { mount: mount, has: has, PAGES: PAGES, pages: P, parsePaste: parsePaste, normArticle: normArticle, normProjectName: normProjectName,
    autoColors: autoColors };
})();
</script>
