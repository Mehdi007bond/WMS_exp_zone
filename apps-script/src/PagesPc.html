<script>
/**
 * EXP2 Digital Twin - PC pages (light theme).
 *
 *   PagesPc.mount(root, page, params)   app bar + the page; in-app navigation through App.go / App.onRoute
 *   PagesPc.has(page)
 *   PagesPc.parsePaste(text, project)    references pasted in the Projets page (also used by the tests)
 *   PagesPc.autoColors(projects)         project colors, same rule as the engine (also used by the tests)
 *
 * Pages (?page=...): twin (Jumeau 3D), plan (Plan 2D), lookup (Recherche article), pending (En attente),
 * projects (Projets: references -> projects, blocks per project), docks (Quais & camions), import (Import SAP MB51),
 * simulation (Simulation). Each page implementation is function (el, params) -> { route(params)?, update(store)?,
 * destroy()? }. Write actions go through App.withKey (key asked once per session in a modal).
 */
(function () {
  'use strict';
  var App = window.App, f = App.fmt, esc = f.esc, h = App.h;
  var SHEETJS_URL = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  // Subresource Integrity of that exact file (sha384, base64): the browser refuses a file that does not match. Empty =
  // not checked. Compute it on a PC that can reach the CDN, and paste it here:
  //   curl -s https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js | openssl dgst -sha384 -binary | openssl base64 -A
  var SHEETJS_SRI = '';
  var CHUNK = 500;          // MB51 lines per api_importLines call
  var REF_CHUNK = 2000;     // references per api_saveReferences call (server limit)
  var PAGES = [
    { id: 'twin', label: 'Jumeau 3D' },
    { id: 'plan', label: 'Plan 2D' },
    { id: 'lookup', label: 'Recherche article' },
    { id: 'pending', label: 'En attente' },
    { id: 'projects', label: 'Projets' },
    { id: 'docks', label: 'Quais & camions' },
    { id: 'import', label: 'Import' },
    { id: 'simulation', label: 'Simulation' }
  ];
  var P = {};

  function has(id) {
    return PAGES.some(function (p) { return p.id === id; });
  }

  function pageLabel(id) {
    var p = PAGES.filter(function (x) { return x.id === id; })[0];
    return p ? p.label : '';
  }

  // num(n): whole number; num(n, dec): dec decimals; num(n, undefined): up to 2 decimals when needed (quantities in KG).
  function num(n, dec) {
    return arguments.length > 1 ? f.num(n, dec) : f.num(n, 0);
  }

  function isNum(n) {
    return n !== null && n !== undefined && n !== '' && isFinite(Number(n));
  }

  var NO_QPP_HINT = 'Article absent de l’onglet ARTICLES : ajoutez sa quantité par palette dans ARTICLES, puis « Recalculer » (onglet ACCUEIL)';

  function pal(n) {
    return n === null || n === undefined ? '<span class="chipd c" title="' + esc(NO_QPP_HINT) + '">?</span>' : num(n);
  }

  // Note under the tables whose « Pal* » column comes from Engine.layerPallets (pallets counted per article).
  var PAL_NOTE = '<div class="panel-note">* Palettes comptées par article (quantité ÷ quantité par palette, arrondie au-dessus) ; ' +
    'la palette entamée est rattachée à la ligne la plus ancienne, une ligne peut donc afficher 0 ou 2.</div>';

  // Server message without the title already shown above it ('Base non installée : …').
  function bodyMessage(m) {
    var t = String(m || '').replace(/^Base non installée\s*:\s*/, '');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function stat(l, v, s, cls) {
    return '<div class="stat' + (cls ? ' ' + cls : '') + '"><div class="l">' + esc(l) + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }

  // Project of an article or a block, with its color swatch ('—' when none).
  function projTag(s, name) {
    if (!name) return '<span class="muted">—</span>';
    return '<span class="ptag"><i style="background:' + esc(App.projectColor(s, name)) + '"></i>' + esc(name) + '</span>';
  }

  // Title of a block on the screens: its projects (state title), '' when free or unnamed.
  function blockTitle(b) {
    var t = String((b && b.title) || '');
    return t && t !== 'Libre' ? t : '';
  }

  function levelChip(lvl) {
    return lvl === 'crit' ? 'c' : lvl === 'warn' ? 'w' : 'n';
  }

  // SheetJS (read and write .xlsx), loaded once from the CDN.
  function loadSheetJs() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return App.loadScript(SHEETJS_URL, 'XLSX', 20000, SHEETJS_SRI);
  }

  // Why pallets are 'À PLACER' (sentence end): their projects' blocks are full, they have no project, or (v1) the
  // blocks of their family are full.
  function toPlaceWhy(s) {
    var list = ((s.blockContents || {})['À PLACER'] || []);
    var named = [], none = false;
    list.forEach(function (e) {
      if (e.project && e.project !== App.NO_PROJECT) {
        if (named.indexOf(e.project) < 0) named.push(e.project);
      } else {
        none = true;
      }
    });
    if (!App.hasProjects(s)) return App.hasFamilies(s) ? 'la capacité des blocs de leur famille est dépassée' : 'la capacité des blocs est dépassée';
    var parts = [];
    if (named.length) parts.push('blocs du projet ' + named.join(', ') + ' pleins');
    if (none) parts.push('références sans projet et aucun bloc libre (page Projets)');
    return parts.join(' ; ') || 'capacité des blocs dépassée';
  }

  /** Notice for pages that need data. Returns true when the page cannot render the state. */
  function needData(el, store) {
    if (store.state && store.status === 'ok') return false;
    var html;
    if (store.status === 'loading') {
      html = '<div class="empty-card"><div class="marking"></div><h2>Chargement…</h2><p>Lecture de l’état de l’entrepôt dans Google Sheets.</p></div>';
    } else if (store.status === 'notInstalled') {
      html = '<div class="empty-card"><div class="marking"></div><h2>Base non installée</h2><p>' + esc(bodyMessage(store.message)) + '</p>' +
        '<p>Ensuite, générez une simulation (page <b>Simulation</b> ou bouton de l’onglet ACCUEIL) ou importez les extractions SAP (page <b>Import</b>).</p></div>';
    } else if (store.status === 'error') {
      html = '<div class="empty-card"><div class="marking"></div><h2>Connexion impossible</h2><p>' + esc(store.message) + '</p>' +
        '<p>Nouvel essai automatique dans la minute. <button type="button" class="btn" data-retry>Réessayer maintenant</button></p></div>';
    } else {
      html = '<div class="empty-card"><div class="marking"></div><h2>Aucune donnée pour l’instant</h2>' +
        '<p>La base est installée mais ne contient encore aucun mouvement SAP. Pour une démonstration, ouvrez la page <b>Simulation</b> ' +
        '(ou utilisez le bouton de simulation de l’onglet ACCUEIL du classeur). Pour les données réelles, déposez les extractions MB51 sur la page <b>Import</b>.</p>' +
        '<p><button type="button" class="btn p" data-go="simulation">Ouvrir la page Simulation</button> <button type="button" class="btn" data-go="import">Ouvrir la page Import</button></p></div>';
    }
    el.innerHTML = html;
    App.$$('[data-go]', el).forEach(function (b) {
      b.addEventListener('click', function () { App.go(b.getAttribute('data-go'), {}); });
    });
    var r = App.$('[data-retry]', el);
    if (r) r.addEventListener('click', function () { App.refresh(true); });
    return true;
  }

  // ---------------------------------------------------------------------------------------------------------------
  // Shell: app bar, notices, router
  // ---------------------------------------------------------------------------------------------------------------
  function mount(root, page, params) {
    root.innerHTML =
      '<div class="pc-app">' +
      '<header class="pc-bar"><div class="pc-brand">EXP2 <span>·</span> Jumeau</div>' +
      '<nav class="pc-nav" aria-label="Pages">' + PAGES.map(function (p) {
        return '<button type="button" data-page="' + p.id + '">' + esc(p.label) + '</button>';
      }).join('') + '</nav>' +
      '<div class="pc-fresh" data-r="fresh"><span class="dot none"></span><span class="lbl">Données SAP du</span><b>—</b></div></header>' +
      '<div class="pc-notice sim" data-r="sim" hidden><b>DONNÉES SIMULÉES</b><span>Base d’exemple générée dans le classeur : ne pas utiliser pour décider.</span></div>' +
      '<div class="pc-notice" data-r="notice" hidden></div>' +
      '<main class="pc-body" data-r="body" tabindex="-1"></main>' +
      '</div>';
    var R = {};
    App.$$('[data-r]', root).forEach(function (e) { R[e.getAttribute('data-r')] = e; });
    App.$$('.pc-nav button', root).forEach(function (b) {
      b.addEventListener('click', function () { App.go(b.getAttribute('data-page'), {}); });
    });
    var cur = null;

    function header(store) {
      var s = store.status === 'empty' ? null : store.state;
      var fr = App.freshness(s);
      var conn = App.connection();
      var sim = !!(s && s.source === 'SIMULATION');
      R.fresh.innerHTML = '<span class="dot ' + (conn ? 'crit' : sim ? 'ok' : fr.level) + '"></span><span class="lbl">' + (s ? esc(fr.lead) : '') + '</span><b>' +
        esc(s ? fr.asOfLabel : 'Aucune donnée SAP') + '</b>' + (s && fr.imported ? '<span class="lbl"> · ' + esc(fr.verb + ' ' + fr.imported) + '</span>' : '') +
        (sim ? '<span class="tag sim">SIMULÉES</span>' : '');
      R.fresh.title = s ? fr.text + (fr.ago ? ' (' + fr.ago + ')' : '') + ' · ' + fr.label : 'Aucune donnée';
      R.sim.hidden = !sim;
      var notice = '', cls = '';
      var thr = App.thresholds(s);
      if (conn) {
        cls = 'crit';
        notice = 'Connexion au serveur perdue (' + esc(conn.message) + '). Les chiffres affichés datent de ' + esc(f.time(store.fetchedAt)) + ' ; nouvel essai automatique.';
      } else if (s && !sim && fr.level === 'crit') {
        cls = 'crit';
        notice = 'Données SAP anciennes : dernier import ' + esc(fr.ago) + '. Importez les extractions du jour (page Import).';
      } else if (s && !sim && fr.level === 'warn') {
        cls = 'warn';
        notice = 'Données SAP de plus de ' + esc(thr.freshWarnH) + ' h : importez les extractions du jour (page Import).';
      }
      R.notice.className = 'pc-notice ' + cls;
      R.notice.innerHTML = notice;
      R.notice.hidden = !notice;
    }

    function open(route, how) {
      var id = has(route.page) ? route.page : 'lookup';
      App.$$('.pc-nav button', root).forEach(function (b) {
        if (b.getAttribute('data-page') === id) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      if (cur && cur.id === id && cur.inst.route) {
        cur.inst.route(route.params || {});
        return;
      }
      if (cur && cur.inst.destroy) cur.inst.destroy();
      R.body.innerHTML = '';
      document.title = pageLabel(id) + ' · EXP2 Jumeau';
      cur = { id: id, inst: P[id](R.body, route.params || {}) || {} };
      if (cur.inst.update) cur.inst.update(App.store);
      if (how === 'push' || how === 'pop') {
        try {
          R.body.focus({ preventScroll: true });
        } catch (e) {
          R.body.focus();
        }
        window.scrollTo(0, 0);
      }
    }

    App.onRoute(open);
    App.onState(function (store) {
      header(store);
      if (cur && cur.inst.update) cur.inst.update(store);
    });
    App.onTick(header);
    header(App.store);
    App.route = { page: page, params: params || {} };
    open(App.route, 'init');
  }

  // ---------------------------------------------------------------------------------------------------------------
  // Jumeau 3D
  // ---------------------------------------------------------------------------------------------------------------
  P.twin = function (el) {
    var MODES = [['project', 'Projet'], ['age', 'Âge'], ['saturation', 'Saturation']];
    var mode = App.session.get('exp2.twinMode') || 'project';
    if (!MODES.some(function (m) { return m[0] === mode; })) mode = 'project';
    var twin = null, shown = null, picked = null;
    el.innerHTML = '<div class="page-head"><h1>Jumeau 3D</h1><p>Palettes par bloc (position théorique, blocs nommés par projet), camions à quai, palettes en attente au convoyeur (rouges au-delà du seuil d’attente).</p></div>' +
      '<div data-r="body"></div>';
    var body = App.$('[data-r="body"]', el);

    function legendHtml(s) {
      var k = s.kpi || {}, thr = App.thresholds(s);
      var items = twin ? twin.legend(s) : (window.IsoView ? window.IsoView.legend(mode, s) : []);
      return '<div class="legend">' + items.map(function (x) { return '<span><i style="background:' + esc(x.color) + '"></i>' + esc(x.label) + '</span>'; }).join('') +
        '<span><i class="ghost"></i>en attente PRD2</span>' +
        (Number(k.pendingCrit) > 0 ? '<span><i class="ghost crit"></i>en attente &gt; ' + esc(App.hText(thr.pendingHoursCrit)) + ' h</span>' : '') + '</div>';
    }

    function pickHtml() {
      if (!picked) return '<p class="small">' + (twin && twin.kind === '3d' ? 'Cliquez sur une palette ou un bloc pour l’identifier.' : 'Les blocs sont détaillés sur la page Plan 2D.') + '</p>';
      var b = picked.block || {}, a = picked.article;
      var s = shown || {};
      var title = blockTitle(b);
      return '<dl class="kv"><dt>Bloc</dt><dd>' + esc(b.id || picked.blockId) + (title ? ' · ' + esc(title) : '') + (b.label ? ' <span class="small">' + esc(b.label) + '</span>' : '') + '</dd>' +
        '<dt>Occupation</dt><dd>' + num(b.pallets) + ' / ' + num(b.capacity) + ' pal · ' + f.pctInt(b.saturation) + '</dd>' +
        (a ? '<dt>Article</dt><dd class="mono">' + esc(a.article) + '</dd><dt>Désignation</dt><dd>' + esc(a.designation || '') + '</dd>' +
          (App.hasProjects(s) ? '<dt>Projet</dt><dd>' + projTag(s, a.project) + '</dd>' : '') +
          '<dt>Palettes</dt><dd>' + num(a.pallets) + ' · âge max ' + f.days(a.ageMax) + '</dd>' : '') + '</dl>' +
        '<div class="actions">' + (a ? '<button type="button" class="btn" data-go-article="' + esc(a.article) + '">Fiche article</button>' : '') +
        '<button type="button" class="btn" data-go-block="' + esc(b.id || picked.blockId) + '">Voir le bloc sur le plan</button></div>';
    }

    function bindPick(t) {
      App.$$('[data-go-article]', t).forEach(function (x) {
        x.addEventListener('click', function () { App.go('lookup', { article: x.getAttribute('data-go-article') }); });
      });
      App.$$('[data-go-block]', t).forEach(function (x) {
        x.addEventListener('click', function () { App.go('plan', { block: x.getAttribute('data-go-block') }); });
      });
    }

    function side(s) {
      var k = s.kpi || {}, thr = App.thresholds(s);
      var t = App.$('[data-r="side"]', body);
      if (!t) return;
      var docks = s.docks || [];
      var projects = App.hasProjects(s);
      var waits = isNum(k.oldestPendingHours) ? 'max ' + f.hm(App.oldestWaitHours(s)) + (Number(k.pendingCrit) > 0 ? ' · <b class="bad-t">' + num(k.pendingCrit) + ' &gt; ' + esc(App.hText(thr.pendingHoursCrit)) + ' h</b>' : '')
        : f.days(k.oldestPendingDays);
      t.innerHTML = '<div class="panel"><h2>Légende<small>' + esc({ project: projects ? 'couleur du projet' : App.hasFamilies(s) ? 'famille de produit' : 'aucun projet : page Projets', age: 'âge de la palette la plus ancienne', saturation: 'saturation du bloc' }[mode]) + '</small></h2>' + legendHtml(s) + '</div>' +
        '<div class="panel" data-r="pick"><h2>Sélection</h2>' + pickHtml() + '</div>' +
        '<div class="panel"><h2>Chiffres clés</h2><dl class="kv">' +
        '<dt>Stock EXP2</dt><dd>' + num(k.exp2Pallets) + ' / ' + num(k.capacity) + ' pal</dd>' +
        '<dt>Saturation</dt><dd><span class="chipd ' + App.satLevel(k.saturation, thr) + '">' + f.pct(k.saturation) + '</span></dd>' +
        '<dt>En attente PRD2</dt><dd>' + num(k.pendingPallets) + ' pal · ' + waits + '</dd>' +
        '<dt>EMRT</dt><dd>' + num(k.emrtPallets) + ' pal</dd>' +
        '<dt>Quais occupés</dt><dd>' + num(k.docksOccupied) + ' / ' + num(k.docksTotal || docks.length) + '</dd>' +
        '<dt>Plus ancienne palette</dt><dd>' + f.days(k.oldestExp2Days) + '</dd></dl></div>' +
        '<div class="panel"><h2>Blocs</h2><table class="tbl"><tbody>' + (s.blocks || []).map(function (b) {
          var title = blockTitle(b);
          return '<tr><td><b>' + esc(b.id) + '</b> <span class="small">' + esc(title || b.families || '') + '</span></td><td class="num">' + num(b.pallets) + ' / ' + num(b.capacity) +
            '</td><td class="num"><span class="chipd ' + App.satLevel(b.saturation, thr) + '">' + f.pctInt(b.saturation) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>';
      bindPick(t);
    }

    function setKind() {
      var note = App.$('.twin-note', body), kind = App.$('[data-r="kind"]', body);
      if (note) note.textContent = twin.kind === '3d' ? 'Glisser pour tourner · clic droit pour déplacer · molette pour zoomer · double-clic pour recentrer' : 'Vue isométrique (3D indisponible sur ce poste)';
      if (kind) kind.textContent = twin.kind === '3d' ? 'Vue 3D' : 'Vue isométrique';
    }

    function build(s) {
      body.innerHTML = '<div class="actions"><span class="small">Couleur des palettes :</span><div class="seg" role="group" aria-label="Couleur des palettes">' +
        MODES.map(function (m) { return '<button type="button" data-mode="' + m[0] + '" aria-pressed="' + (m[0] === mode) + '">' + m[1] + '</button>'; }).join('') +
        '</div><span class="small" data-r="kind"></span></div>' +
        '<div class="twin-grid"><div class="twin-stage" data-r="stage"></div><div class="col" data-r="side"></div></div>';
      var stage = App.$('[data-r="stage"]', body);
      twin = App.mountTwin(stage, s, {
        autoRotate: false, theme: 'dark', mode: mode, boost: 1.3,
        onPick: function (info) {
          picked = info;
          if (twin) twin.highlight(info && info.article ? info.article.article : null);
          var t = App.$('[data-r="pick"]', body);
          if (t) {
            t.innerHTML = '<h2>Sélection</h2>' + pickHtml();
            bindPick(t);
          }
        },
        onSwitch: function () {
          setKind();
          side(shown);
        }
      });
      stage.appendChild(h('div', { 'class': 'twin-note' }));
      setKind();
      App.$$('.seg button', body).forEach(function (b) {
        b.addEventListener('click', function () {
          mode = b.getAttribute('data-mode');
          App.session.set('exp2.twinMode', mode);
          App.$$('.seg button', body).forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          twin.setMode(mode);
          side(shown);
        });
      });
      side(s);
    }

    return {
      update: function (store) {
        if (needData(body, store)) {
          if (twin) twin.destroy();
          twin = null;
          shown = null;
          return;
        }
        if (store.state === shown) return;
        shown = store.state;
        if (!twin) build(shown);
        else {
          twin.update(shown);
          side(shown);
        }
      },
      destroy: function () {
        if (twin) twin.destroy();
      }
    };
  };

  // ---------------------------------------------------------------------------------------------------------------
  // Plan 2D
  // ---------------------------------------------------------------------------------------------------------------
  P.plan = function (el, params) {
    var selected = params.block || '';
    var shown = null;
    el.innerHTML = '<div class="page-head"><h1>Plan 2D</h1><p>Blocs colorés selon leur saturation et nommés par leur projet. Cliquez sur un bloc pour voir son contenu. Positions théoriques.</p></div><div data-r="body"></div>';
    var body = App.$('[data-r="body"]', el);

    function render(s) {
      var thr = App.thresholds(s), k = s.kpi || {};
      var blocks = s.blocks || [];
      var projects = App.hasProjects(s);
      if (!selected || !blocks.some(function (b) { return b.id === selected; })) {
        selected = blocks.slice().sort(function (a, b) { return (b.saturation || 0) - (a.saturation || 0); })[0];
        selected = selected ? selected.id : '';
      }
      var sat = {};
      blocks.forEach(function (b) { sat[b.id] = b.saturation; });
      body.innerHTML = '<div class="plan-grid"><div class="panel plan-panel"><h2>Plan 2D · saturation par bloc<small>' +
        (projects ? 'blocs nommés par projet · placement théorique' : 'placement théorique · ' + App.placementText(s)) + '</small></h2>' +
        '<svg data-r="svg" aria-label="Plan 2D de l’entrepôt EXP2, blocs colorés selon leur saturation et nommés par projet"></svg>' +
        '<div class="actions">' + window.Plan2D.legendHtml(thr) + window.Plan2D.projectLegendHtml(App.projectLegend(s)) + '</div>' +
        '<div class="panel-note">Seuils réglables dans le classeur. Projets et zones : page <a href="#" data-go="projects">Projets</a>. Libellés d’allée à confirmer (relevé terrain).</div></div>' +
        '<div class="col" data-r="side"></div></div>';
      // Full plan (dock numbers, Zone camion, zones, conveyor, dimensions): the panel is wide enough.
      window.Plan2D.build(App.$('[data-r="svg"]', body), s.layout, {
        compact: false, sat: sat, thresholds: thr, select: selected, trucks: s.docks || [], ghosts: k.pendingPallets || 0,
        ghostsCrit: k.pendingCrit || 0, projectColors: projects ? s.projects : null,
        onBlockClick: function (id) { App.go('plan', { block: id }, { replace: true }); }
      });
      App.$$('[data-go]', body).forEach(function (a) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          App.go(a.getAttribute('data-go'), {});
        });
      });
      side(s);
    }

    function side(s) {
      var thr = App.thresholds(s);
      var projects = App.hasProjects(s);
      var b = (s.blocks || []).filter(function (x) { return x.id === selected; })[0];
      var t = App.$('[data-r="side"]', body);
      var html = '';
      if (b) {
        var rows = ((s.blockContents || {})[b.id] || []).slice().sort(function (x, y) { return (y.pallets - x.pallets) || ((y.ageMax || 0) - (x.ageMax || 0)); });
        var lvl = App.satLevel(b.saturation, thr);
        var title = blockTitle(b);
        var who;
        if ((b.projects || []).length) who = 'Projet' + (b.projects.length > 1 ? 's' : '') + ' : ' + b.projects.map(function (p) { return projTag(s, p); }).join(' ');
        else if (b.families) who = 'Famille(s) prévue(s) : ' + esc(b.families);
        else who = projects ? 'Bloc libre : reçoit les références sans projet' : 'Aucune famille prévue';
        html += '<div class="panel"><h2>Bloc ' + esc(b.id) + (title ? ' · ' + esc(title) : '') + (b.label ? '<small>' + esc(b.label) + '</small>' : '') + '</h2>' +
          '<div class="blk-head"><span class="big">' + num(b.pallets) + '</span><span class="muted">/ ' + num(b.capacity) + ' emplacements</span><span class="chipd ' + lvl + '">' + f.pct(b.saturation) + '</span></div>' +
          '<div class="bar2"><i style="width:' + Math.min(100, (b.saturation || 0) * 100) + '%;background:' + App.satColor(b.saturation, thr) + '"></i></div>' +

  // ---------------------------------------------------------------------------------------------------------------
  // Projets: references -> projects, blocks (zones) per project (docs/SPEC_V2.md 5 and 7)
  // ---------------------------------------------------------------------------------------------------------------
  var ARTICLE_RE = /^[0-9A-Za-z._\/-]{1,40}$/;
  // First pasted line taken as a header (Excel column titles), compared without accents or case: the reference column
  // and the project column are found by their titles (other columns, e.g. Désignation, are ignored).
  var HEADER_RE = /^(articles?|references?( articles?)?|ref\.?( article)?|code( article)?|code produit|n[o°]\.? ?(d')?article|numero( d'article)?|materiel|material|part ?number|pn)$/;
  var PROJECT_HEADER_RE = /^(projets?|projects?|nom (du )?projet)$/;
  var MAX_PROJECT_LEN = 40;

  // Spaces of every kind (no-break, thin, figure, BOM) -> one plain space, trimmed.
  function cleanSpaces(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[\u00a0\u202f\u2007\u2009\ufeff]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function unquote(s) {
    var m = /^"([\s\S]*)"$/.exec(s);
    return m ? m[1].replace(/""/g, '"').trim() : s;
  }

  /**
   * Article code as the server stores it: trimmed, upper case, leading zeros removed from all-digit codes,
   * ^[0-9A-Za-z._/-]{1,40}$. Digits grouped by Excel or a mail ('73 871 645') are joined. split: the pasted line had
   * columns (a space is then a wrong character, not a missing separator). -> { code, error }
   */
  function normArticle(raw, split) {
    var s = unquote(cleanSpaces(raw));
    if (/^\d{1,3}( \d{3})+$/.test(s)) s = s.replace(/ /g, '');
    var code = s.toUpperCase();
    if (/^\d+$/.test(code)) code = code.replace(/^0+(?=\d)/, '');
    var error = '';
    if (!code) error = 'Référence vide';
    else if (/^\d+([.,]\d+)?E[+-]?\d+$/.test(code)) error = 'Référence affichée en notation scientifique par Excel (ex. 7,39E+07) : mettez la colonne au format Texte, puis recopiez-la';
    else if (/\s/.test(code) && !split) error = 'Espace dans la référence : séparez la référence et le projet par une tabulation (copie Excel) ou un point-virgule';
    else if (!ARTICLE_RE.test(code)) error = 'Référence invalide : lettres, chiffres et . _ / - seulement, 40 caractères au plus';
    return { code: code, error: error };
  }

  /**
   * Project name as the server stores it: trimmed, spaces collapsed, at most 40 characters, no , ; |.
   * 'Sans projet' means: remove the project. -> { name, given, remove, error }
   */
  function normProjectName(raw) {
    var s = unquote(cleanSpaces(raw));
    if (!s || s === '-' || s === '—') return { name: '', given: false, remove: false, error: '' };
    if (App.fold(s) === App.fold(App.NO_PROJECT)) return { name: '', given: true, remove: true, error: '' };
    if (s.length > MAX_PROJECT_LEN) return { name: s, given: true, remove: false, error: 'Nom de projet trop long (' + MAX_PROJECT_LEN + ' caractères au plus)' };
    if (/[,;|]/.test(s)) return { name: s, given: true, remove: false, error: 'Nom de projet invalide : pas de virgule, point-virgule ni barre verticale' };
    return { name: s, given: true, remove: false, error: '' };
  }

  function sameName(a, b) {
    return App.fold(a) === App.fold(b);
  }

  /**
   * References pasted in the Projets page. One reference per line, or two columns copied from Excel
   * (Référence ⇥ Projet; « ; » separates too). Blank lines, surrounding spaces and a header line are ignored, and so
   * is an Excel row whose reference cell is empty (its project is not a reference); a reference given twice is merged
   * (its last project wins, conflicts are listed); numeric codes lose their leading zeros like on the server. A line
   * without its own project takes defaultProject. With a header line, the columns are found by their titles
   * (Article / Référence, Projet), so more columns can be pasted; without one, a line of more than two columns is
   * refused (a designation must never be taken for a project). Same rules as the sheet panel SidebarProjets.html.
   * -> { rows: [{ article, error, project, remove, projectError, source: 'colonne' | 'champ' | '', line, count,
   *      conflict: [project names] }], blank, header (true when a header line was skipped), lines, merged, noRef }
   */
  function parsePaste(text, defaultProject) {
    var def = normProjectName(defaultProject);
    var out = { rows: [], blank: 0, header: false, lines: 0, merged: 0, noRef: 0 };
    var byCode = {};
    var first = true;
    var colRef = 0, colProj = 1, byHeader = false;
    // A copy from Excel ends with a line break: not a blank line of the user's.
    String(text || '').replace(/(\r\n|\r|\n)$/, '').split(/\r\n|\r|\n/).forEach(function (line, i) {
      var t = String(line).replace(/\ufeff/g, '');
      if (!cleanSpaces(t)) {
        out.blank++;
        return;
      }
      var cols = t.indexOf('\t') >= 0 ? t.split('\t') : t.indexOf(';') >= 0 ? t.split(';') : [t];
      while (cols.length > 1 && !cleanSpaces(cols[cols.length - 1])) cols.pop();
      if (first) {
        first = false;
        var refAt = -1, projAt = -1;
        cols.forEach(function (c, k) {
          var n = App.fold(cleanSpaces(c)).replace(/[’`]/g, '\'');
          if (refAt < 0 && HEADER_RE.test(n)) refAt = k;
          else if (projAt < 0 && PROJECT_HEADER_RE.test(n)) projAt = k;
        });
        if (refAt >= 0 || projAt >= 0) {
          out.header = true;
          byHeader = true;
          colRef = refAt >= 0 ? refAt : 0;
          colProj = projAt;
          return;
        }
      }
      if (!cleanSpaces(cols[colRef])) {
        out.noRef++;
        return;
      }
      out.lines++;
      var a = normArticle(cols[colRef], cols.length > 1);
      var extra = !byHeader && cols.filter(function (c) { return cleanSpaces(c); }).length > 2;
      if (!a.error && extra) {
        a.error = 'Plus de deux colonnes : collez seulement Référence et Projet, ou copiez aussi la ligne de titres (Référence, Projet)';
      }
      var p = colProj >= 0 && cols.length > colProj ? normProjectName(cols[colProj]) : { name: '', given: false, remove: false, error: '' };
      var use = p.given ? p : def;
      var row = { article: a.code, error: a.error, project: use.name, remove: !!use.remove, projectError: use.error || '',
        source: p.given ? 'colonne' : def.given ? 'champ' : '', line: i + 1, count: 1, conflict: [] };
      if (!a.error) {
        var prev = byCode[a.code];
        if (prev) {
          prev.count++;
          out.merged++;
          if (row.source) {
            var before = prev.remove ? App.NO_PROJECT : prev.project, after = row.remove ? App.NO_PROJECT : row.project;
            if (prev.source && !sameName(before, after)) {
              if (prev.conflict.indexOf(before) < 0) prev.conflict.push(before);
              if (prev.conflict.indexOf(after) < 0) prev.conflict.push(after);
            }
            prev.project = row.project;
            prev.remove = row.remove;
            prev.projectError = row.projectError;
            prev.source = row.source;
          }
          return;
        }
        byCode[a.code] = row;
      }
      out.rows.push(row);
    });
    return out;
  }

  // Colors of the projects as the engine gives them: PROJETS › Couleur, else the palette in sorted name order.
  function autoColors(projects) {
    var palette = (App.CFG.COLORS && App.CFG.COLORS.projects) || ['#7fb3e0', '#f2b27a', '#8fd19e', '#e79ac0', '#c3a6e8', '#f3d36b'];
    var names = projects.map(function (p) { return p.project; }).sort(function (a, b) {
      var x = a.toLowerCase(), y = b.toLowerCase();
      return x < y ? -1 : x > y ? 1 : a < b ? -1 : a > b ? 1 : 0;
    });
    // Same rule as the engine: the palette color of the rank in name order, or the next one not used yet.
    var isColor = function (c) { return /^#[0-9a-fA-F]{6}$/.test(c || ''); };
    var taken = {};
    projects.forEach(function (p) {
      if (isColor(p.color)) taken[p.color.toLowerCase()] = true;
    });
    var out = {};
    names.forEach(function (n, i) {
      var p = projects.filter(function (x) { return x.project === n; })[0];
      if (isColor(p.color)) {
        out[n] = p.color.toLowerCase();
        return;
      }
      var c = palette[i % palette.length];
      for (var k = 0; k < palette.length; k++) {
        if (!taken[palette[(i + k) % palette.length].toLowerCase()]) {
          c = palette[(i + k) % palette.length];
          break;
        }
      }
      taken[c.toLowerCase()] = true;
      out[n] = c;
    });
    return out;
  }

  P.projects = function (el, params) {

      '<label class="field inline"><span>Projet</span><select data-r="allProject"></select></label>' +

      '<button type="button" class="btn p" data-r="allSave" hidden>Enregistrer</button></div><div data-r="all"></div></section>';
    var R = {};
    App.$$('[data-r]', el).forEach(function (e) { R[e.getAttribute('data-r')] = e; });
    R.allQ.value = allFilter.q;

    // ---- data ----------------------------------------------------------------------------------------------
    function state() {
      return App.store.status === 'ok' ? App.store.state : null;

    // Read-only data from the state when the server has no api_getProjects (old deployment).
    function dataFromState(s) {
      var layoutBlocks = ((s && s.layout && s.layout.blocks) || (App.CFG.DEFAULT_LAYOUT || {}).blocks || []);
      return {
        fromState: true,
        projects: ((s && s.projectsList) || []).filter(function (p) { return p.project !== App.NO_PROJECT; }).map(function (p) {
          return { project: p.project, blocks: (p.blocks || []).slice(), color: '', comment: '' };
        }),
        references: ((s && s.articles) || []).filter(function (a) { return a.p; }).map(function (a) { return { article: a.a, designation: a.d, project: a.p }; }),
        blocks: layoutBlocks.map(function (b) {

    function load() {

          return { project: String(p.project || ''), blocks: (p.blocks || []).map(String), color: p.color || '', comment: p.comment || '',

        data.references = data.references || [];
        data.blocks = (data.blocks && data.blocks.length) ? data.blocks : dataFromState(state()).blocks;
        // Zones being edited survive a reload (after another section saved): the saved zones become the new base.

        var editing = draftDirty() ? draft.projects : null;

    function projectNames() {
      var out = [];
      function add(n) {
        if (n && n !== App.NO_PROJECT && !out.some(function (x) { return sameName(x, n); })) out.push(n);
      }
      (data ? data.projects : []).forEach(function (p) { add(p.project); });
      ((state() || {}).projectsList || []).forEach(function (p) { add(p.project); });
      (draft ? draft.projects : []).forEach(function (p) { add(p.project); });
      (data ? data.references : []).forEach(function (r) { add(r.project); });
      return out.sort(function (a, b) { return a.localeCompare(b, 'fr', { sensitivity: 'base' }); });
    }

    // Spelling already used for a name (case-insensitive), else the name as typed.
    function canonical(name) {

    /**

     */
    function refs() {
      var map = {};
      var s = state();
      ((s && s.articles) || []).forEach(function (a) {
        var code = normArticle(a.a).code;
        map[code] = { article: String(a.a), designation: a.d || '', project: a.p || '', inArticles: false, tracked: true,
          e: a.e, w: a.w, m: a.m, q: a.q, qs: a.qs || '', t: a.t || '' };
      });
      (data ? data.references : []).forEach(function (r) {
        var code = normArticle(r.article).code;
        if (!code) return;
        var x = map[code] || (map[code] = { article: String(r.article), designation: '', project: '', tracked: false, e: null, w: null, m: null, q: null, qs: '', t: '' });
        x.inArticles = true;
        x.project = r.project || '';
        if (!x.designation) x.designation = r.designation || '';

      if (data && data.fromState) {

      }

    // ---- writes ---------------------------------------------------------------------------------------------
    // Copy read from the state (the server did not answer api_getProjects): nothing can be saved from it.

      return data && data.fromState ? new Error('Projets en lecture seule (' + (dataError || 'serveur indisponible') + ') : rien n’a été enregistré. ' +
        '« Réessayer » en haut de la page.') : null;

    // Saves [{ article, project }] by batches of REF_CHUNK with the admin key; resolves to the summed answer.
    function saveRefs(rows) {
      var ro = readOnlyError();
      if (ro) return Promise.reject(ro);
      var chunks = [];
      for (var i = 0; i < rows.length; i += REF_CHUNK) chunks.push(rows.slice(i, i + REF_CHUNK));
      return App.withKey('admin', function (key) {
        var total = { created: 0, updated: 0, unchanged: 0, invalid: [], newProjects: [], message: '' };
        var p = Promise.resolve();
        chunks.forEach(function (c) {
          p = p.then(function () {
            return App.call('api_saveReferences', key, c).then(function (res) {
              res = res || {};
              total.created += Number(res.created) || 0;
              total.updated += Number(res.updated) || 0;
              total.unchanged += Number(res.unchanged) || 0;
              total.invalid = total.invalid.concat(res.invalid || []);
              (res.newProjects || []).forEach(function (n) { if (total.newProjects.indexOf(n) < 0) total.newProjects.push(n); });
              total.message = res.message || total.message;
            });
          });
        });
        return p.then(function () { return total; });
      });
    }

    // While a write runs every action is disabled; afterwards the sections redraw their buttons from their own state.
    function setBusy(b) {

      renderZones();
      renderNone();
      updateDirty();

    function resultText(res) {

    // ---- status, stats, table of contents ---------------------------------------------------------------------

    // ---- 1. paste -----------------------------------------------------------------------------------------------
    // newNames: { folded name: spelling } of the new projects of the paste, the first spelling wins (the server keeps
    // the first one it writes): « zephyr » in the field and « ZEPHYR » in a cell make one project, not two.
    function pasteStatus(row, map, newNames) {
      if (row.error) return { kind: 'invalid', text: 'Invalide', why: row.error };
      if (row.projectError) return { kind: 'invalid', text: 'Invalide', why: row.projectError };
      if (!row.source) return { kind: 'invalid', text: 'Invalide', why: 'Projet manquant : saisissez-le dans « Projet » ou en deuxième colonne' };
      var ref = map[row.article];
      var target = row.remove ? '' : canonical(row.project);
      if (target && newNames && !isKnownProject(target)) {
        var key = App.fold(target);
        if (!newNames[key]) newNames[key] = target;
        target = newNames[key];
      }
      var cur = ref ? ref.project || '' : '';
      if (!ref || !ref.inArticles) {
        if (!target) return { kind: 'same', text: 'Inchangée', why: 'déjà sans projet', target: target };
        return { kind: 'new', text: 'Nouvelle', why: 'ajoutée à l’onglet ARTICLES', target: target };
      }
      if (sameName(cur, target)) return { kind: 'same', text: 'Inchangée', why: '', target: target };
      return { kind: 'change', text: 'Changement', why: '', target: target };
    }

    function renderPreview() {
      var box = R.preview;
      if (!pasted) {
        box.innerHTML = (pasteResult ? '<div class="' + pasteResult.kind + '">' + pasteResult.html + '</div>' : '') +
          '<div class="empty-note">Collez une colonne de références copiée d’Excel, choisissez le projet, puis « Aperçu ». Rien n’est enregistré avant « Enregistrer ».</div>';
        return;

      var map = refs();

      var rows = pasted.rows.map(function (r) {
        var st = pasteStatus(r, map, newNames);
        tally[st.kind]++;
        if ((st.kind === 'new' || st.kind === 'change') && st.target && !isKnownProject(st.target) && fresh.indexOf(st.target) < 0) fresh.push(st.target);
        return { row: r, st: st, ref: map[r.article] };
      });
      var toSave = tally['new'] + tally.change;
      var notes = [];
      if (pasted.header) notes.push('ligne d’en-tête ignorée');

      if (pasted.noRef) notes.push(f.plural(pasted.noRef, 'ligne sans référence ignorée', 'lignes sans référence ignorées'));
      if (pasted.merged) notes.push(f.plural(pasted.merged, 'doublon fusionné', 'doublons fusionnés'));
      var order = { invalid: 0, change: 1, 'new': 2, same: 3 };
      rows.sort(function (a, b) { return (order[a.st.kind] - order[b.st.kind]) || (a.row.line - b.row.line); });
      box.innerHTML = '<div class="pj-sum" data-r="pasteSummary"><b>' + f.plural(pasted.rows.length, 'référence', 'références') + '</b> : ' +
        '<span class="chipd b">' + num(tally['new']) + ' ' + (tally['new'] > 1 ? 'nouvelles' : 'nouvelle') + '</span> ' +
        '<span class="chipd w">' + num(tally.change) + ' ' + (tally.change > 1 ? 'changements' : 'changement') + '</span> ' +
        '<span class="chipd n">' + num(tally.same) + ' ' + (tally.same > 1 ? 'inchangées' : 'inchangée') + '</span> ' +
        '<span class="chipd c">' + num(tally.invalid) + ' ' + (tally.invalid > 1 ? 'invalides' : 'invalide') + '</span>' +
        (fresh.length ? ' · <span class="new-proj">nouveau' + (fresh.length > 1 ? 'x projets' : ' projet') + ' : ' + esc(fresh.join(', ')) + '</span>' : '') +
        (notes.length ? '<div class="small">' + esc(notes.join(' · ')) + '</div>' : '') + '</div>' +
        '<div class="tbl-wrap"><table class="tbl" data-r="pasteTable"><thead><tr><th>Référence</th><th>Désignation</th><th>Projet actuel</th><th>Nouveau projet</th><th>Statut</th></tr></thead><tbody>' +
        rows.map(function (x) {
          var r = x.row, st = x.st, ref = x.ref;
          var designation = ref && ref.designation ? esc(ref.designation) : '<span class="muted"><i>jamais vue dans les données</i></span>';
          var curProj = ref && ref.project ? projTag(state(), ref.project) : '<span class="muted">—</span>';
          var target = st.kind === 'invalid' ? '<span class="muted">' + esc(r.remove ? App.NO_PROJECT : r.project || '—') + '</span>' :
            (st.target ? projTag(state(), st.target) + (!isKnownProject(st.target) ? ' <span class="tag new">nouveau</span>' : '') : '<span class="muted">Sans projet</span>');
          var chip = { 'new': 'b', change: 'w', same: 'n', invalid: 'c' }[st.kind];
          var extra = [];
          if (st.why) extra.push(esc(st.why));
          if (r.count > 1) extra.push('collée ' + r.count + ' fois');
          if (r.conflict.length) extra.push('projets différents : ' + esc(r.conflict.join(', ')) + ' (le dernier est retenu)');
          return '<tr class="st-' + st.kind + '" data-article="' + esc(r.article) + '" data-status="' + st.kind + '"><td class="mono">' + esc(r.article || '(vide)') + '<span class="sub">ligne ' + r.line + '</span></td>' +
            '<td>' + designation + '</td><td>' + curProj + '</td><td>' + target + '</td>' +
            '<td><span class="chipd ' + chip + '">' + st.text + '</span>' + (extra.length ? '<span class="sub">' + extra.join(' · ') + '</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="actions"><button type="button" class="btn p lg" data-save="paste"' + (toSave && !busy ? '' : ' disabled') + '>' +
        (toSave ? 'Enregistrer (' + toSave + ')' : 'Rien à enregistrer') + '</button>' +
        (tally.invalid ? '<span class="small bad-t">Les lignes invalides ne sont pas enregistrées : corrigez-les puis « Aperçu ».</span>' : '') + '</div>';
      var btn = App.$('[data-save="paste"]', box);
      if (btn) btn.addEventListener('click', function () {
        savePaste(rows.filter(function (x) { return x.st.kind === 'new' || x.st.kind === 'change'; }).map(function (x) {
          return { article: x.row.article, project: x.st.target || '' };
        }));
      });
    }

    function preview() {
      pasteResult = null;
      var text = R.pasteText.value;
      if (!cleanSpaces(text)) {
        pasted = null;
        renderPreview();
        R.pasteText.focus();
        return;
      }
      pasted = parsePaste(text, R.pasteProject.value);
      renderPreview();
    }

    function savePaste(rows) {
      if (busy || !rows.length) return;
      setBusy(true);
      saveRefs(rows).then(function (res) {
        setBusy(false);
        pasteResult = { kind: res.invalid.length ? 'alert-box' : 'info-box', html: '<b>Enregistré</b> : ' + esc(resultText(res)) + invalidHtml(res.invalid) };
        pasted = null;
        R.pasteText.value = '';
        App.toast('Références enregistrées : ' + resultText(res), res.invalid.length ? 'warn' : 'ok');
        renderPreview();
        afterWrite();
      }, function (err) {
        setBusy(false);
        renderPreview();
        if (err && err.cancelled) return;
        pasteResult = { kind: 'alert-box', html: '<b>Échec de l’enregistrement</b> : ' + esc(err.message) };
        var box = R.preview;
        box.insertAdjacentHTML('afterbegin', '<div class="alert-box">' + pasteResult.html + '</div>');
        App.toast(err.message, 'error');
      });
    }

    App.$('[data-act="preview"]', el).addEventListener('click', preview);
    App.$('[data-act="clearPaste"]', el).addEventListener('click', function () {
      R.pasteText.value = '';
      pasted = null;
      pasteResult = null;
      renderPreview();
      R.pasteText.focus();
    });
    R.pasteText.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
        ev.preventDefault();
        preview();
      }
    });
    R.pasteProject.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        preview();
      }
    });
    // Keep the preview in step with what is typed once it is shown.
    var livePreview = App.debounce(function () { if (pasted) preview(); }, 300);
    R.pasteText.addEventListener('input', livePreview);
    R.pasteProject.addEventListener('input', livePreview);

    // ---- 2. zones -------------------------------------------------------------------------------------------------
    function draftProject(name) {
      return draft.projects.filter(function (p) { return sameName(p.project, name); })[0] || null;
    }

    function blockProjects(id) {
      return draft.projects.filter(function (p) { return p.blocks.indexOf(id) >= 0; });
    }

    function draftColors() {
      var s = state();
      var auto = autoColors(draft.projects);
      var out = {};
      draft.projects.forEach(function (p) {
        out[p.project] = p.color || (s && s.projects && s.projects[p.project] && !draftDirty() ? s.projects[p.project] : auto[p.project]);
      });
      return out;
    }

    function addToBlock(id, raw) {
      var n = normProjectName(raw);
      if (n.error) return n.error;
      if (!n.name) return 'Saisissez un nom de projet.';
      var p = draftProject(n.name);
      if (!p) {
        p = { project: canonical(n.name), blocks: [], color: '', comment: '' };
        draft.projects.push(p);
      }
      if (p.blocks.indexOf(id) < 0) p.blocks.push(id);
      return '';
    }

    function removeFromBlock(id, name) {
      var p = draftProject(name);
      if (p) p.blocks = p.blocks.filter(function (b) { return b !== id; });
    }

    // Blocks whose « + projet » field holds a name not added yet (kept across redraws, added by the save button).
    function typedBlocks() {
      return Object.keys(zoneTyped).filter(function (id) { return cleanSpaces(zoneTyped[id]); });
    }

    // Adds the names typed and not added yet; '' when done, else the first problem.
    function commitTyped() {
      var ids = typedBlocks();
      for (var i = 0; i < ids.length; i++) {
        var problem = addToBlock(ids[i], zoneTyped[ids[i]]);
        if (problem) return 'Bloc ' + ids[i] + ' : ' + problem;
        delete zoneTyped[ids[i]];
      }
      return '';
    }

    // Save / cancel buttons and status of the zones, without redrawing the table (the field being typed in stays).
    function syncZoneButtons() {
      var dirty = draftDirty(), typed = typedBlocks().length > 0;
      var save = App.$('[data-save="zones"]', R.zones), cancel = App.$('[data-act="zonesCancel"]', R.zones), st = App.$('[data-r="zoneState"]', R.zones);
      if (save) save.disabled = !(dirty || typed) || busy;
      if (cancel) cancel.disabled = !(dirty || typed);
      if (st) {
        st.className = 'small ' + (dirty || typed ? 'warn-t' : 'muted');
        st.textContent = typed ? 'Projet saisi pas encore ajouté : Entrée pour l’ajouter (ou « Enregistrer les zones »)' :
          dirty ? 'Modifications non enregistrées' : 'Zones enregistrées dans l’onglet PROJETS';
      }
    }

    function renderZones(focusBlock) {
      if (!data || !draft) {
        R.zones.innerHTML = '<div class="empty-note">' + (loading ? 'Chargement…' : 'Zones indisponibles.') + '</div>';
        return;
      }
      // A redraw (new state, another section saved) keeps the field being typed in and its cursor.
      var active = document.activeElement;
      var keep = active && R.zones.contains(active) && active.hasAttribute('data-add') ? { id: active.getAttribute('data-add'), at: active.selectionStart } : null;
      if (!focusBlock && keep) focusBlock = keep.id;
      var colors = draftColors();
      var dirty = draftDirty();
      var blocks = data.blocks || [];
      var list = draft.projects.slice().sort(function (a, b) { return a.project.localeCompare(b.project, 'fr', { sensitivity: 'base' }); });
      // Two projects with the same color cannot be told apart on the plan and in 3D: say which one to change.
      var sameColor = {};
      list.forEach(function (p, i) {
        var c = String(colors[p.project] || '').toLowerCase();
        for (var j = 0; j < i; j++) {
          if (c && String(colors[list[j].project] || '').toLowerCase() === c) {
            sameColor[p.project] = list[j].project;
            break;
          }
        }
      });
      R.zones.innerHTML = '<div class="pj-zones"><div><table class="tbl zones"><thead><tr><th>Bloc</th><th>Libellé (sketch)</th><th class="num">Capacité</th><th>Projets</th></tr></thead><tbody>' +
        blocks.map(function (b) {
          var projs = blockProjects(b.id);
          return '<tr data-block="' + esc(b.id) + '"><td><b>' + esc(b.id) + '</b></td><td class="small">' + esc(b.label || '—') + '</td><td class="num">' + num(b.capacity) + ' pal</td>' +
            '<td><div class="chips">' + projs.map(function (p) {
              return '<span class="chip" style="--c:' + esc(colors[p.project] || App.NO_PROJECT_COLOR) + '"><i></i>' + esc(p.project) +
                '<button type="button" data-remove="' + esc(p.project) + '" aria-label="Retirer ' + esc(p.project) + ' du bloc ' + esc(b.id) + '">×</button></span>';
            }).join('') + (projs.length ? '' : '<span class="muted small">libre</span>') +
            '<input class="chip-in" list="pj-names" maxlength="40" autocomplete="off" placeholder="+ projet" aria-label="Ajouter un projet au bloc ' + esc(b.id) + '" data-add="' + esc(b.id) + '"' +
            (zoneTyped[b.id] ? ' value="' + esc(zoneTyped[b.id]) + '"' : '') + '></div></td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="small zone-err" data-r="zoneErr" role="alert"></div>' +
        '<div class="actions"><button type="button" class="btn p" data-save="zones" disabled>Enregistrer les zones</button>' +
        '<button type="button" class="btn" data-act="zonesCancel" disabled>Annuler les changements</button>' +
        '<span class="small muted" data-r="zoneState" aria-live="polite"></span></div>' +
        '<p class="small">Entrée ajoute le projet saisi · Retour arrière dans un champ vide retire le dernier projet du bloc. Un bloc sans projet reçoit les références sans projet.</p></div>' +
        '<div class="pj-plan"><svg data-r="zonePlan" role="img" aria-label="Aperçu du plan : noms des projets sur les blocs"></svg>' +
        '<div class="pj-colors"><h3>Couleurs des projets</h3>' + (list.length ? list.map(function (p) {
          return '<label class="pc"><input type="color" value="' + esc(colors[p.project] || '#cccccc') + '" data-color="' + esc(p.project) + '" aria-label="Couleur du projet ' + esc(p.project) + '">' +
            '<span>' + esc(p.project) + (sameColor[p.project] ? ' <b class="warn-t small">même couleur que ' + esc(sameColor[p.project]) + '</b>' : '') + '</span>' +
            '<span class="small muted">' + (p.blocks.length ? esc(p.blocks.join(', ')) : 'aucun bloc') + '</span>' +
            (p.color ? '<button type="button" class="btn sm" data-auto="' + esc(p.project) + '" title="Revenir à la couleur automatique de la palette">couleur auto</button>' :
              '<span class="small muted" title="Couleur choisie automatiquement : cliquez sur le carré pour la changer">automatique</span>') + '</label>';
        }).join('') : '<p class="small muted">Aucun projet : collez des références avec un projet (1) ou saisissez un nom sur un bloc.</p>') + '</div></div></div>';
      var layout = (state() && state().layout) || App.CFG.DEFAULT_LAYOUT;
      var titles = {}, byBlock = {};
      blocks.forEach(function (b) {
        var names = blockProjects(b.id).map(function (p) { return p.project; });
        titles[b.id] = names.length ? names.join(' / ') : 'Libre';
        byBlock[b.id] = names;
      });
      window.Plan2D.build(App.$('[data-r="zonePlan"]', R.zones), layout, { compact: true, titles: titles, projects: byBlock, projectColors: colors, fill: 'project', titleSize: 13 });
      var err = App.$('[data-r="zoneErr"]', R.zones);
      App.$$('[data-add]', R.zones).forEach(function (inp) {
        var id = inp.getAttribute('data-add');
        function commit() {
          if (!cleanSpaces(inp.value)) return;
          var problem = addToBlock(id, inp.value);
          if (problem) {
            err.textContent = 'Bloc ' + id + ' : ' + problem;
            return;
          }
          delete zoneTyped[id];
          renderZones(id);
          renderStats();
        }
        inp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            commit();
          } else if (ev.key === 'Backspace' && !inp.value) {
            var projs = blockProjects(id);
            if (projs.length) {
              removeFromBlock(id, projs[projs.length - 1].project);
              renderZones(id);
              renderStats();
            }
          }
        });
        // A pick in the list of existing projects adds it at once (typing the same name letter by letter does not: the
        // table is not redrawn under the cursor, nor under a click on « Enregistrer les zones »).
        inp.addEventListener('input', function (ev) {
          zoneTyped[id] = inp.value;
          err.textContent = '';
          var picked = !ev.inputType || ev.inputType === 'insertReplacementText';
          if (picked && projectNames().some(function (n) { return n === inp.value.trim(); })) commit();
          else syncZoneButtons();
        });
      });
      App.$$('[data-remove]', R.zones).forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.closest('tr').getAttribute('data-block');
          removeFromBlock(id, b.getAttribute('data-remove'));
          renderZones(id);
          renderStats();
        });
      });
      App.$$('[data-color]', R.zones).forEach(function (inp) {
        inp.addEventListener('change', function () {
          var p = draftProject(inp.getAttribute('data-color'));
          if (p) p.color = inp.value.toLowerCase();
          renderZones();
        });
      });
      App.$$('[data-auto]', R.zones).forEach(function (b) {
        b.addEventListener('click', function () {
          var p = draftProject(b.getAttribute('data-auto'));
          if (p) p.color = '';
          renderZones();
        });
      });
      App.$('[data-save="zones"]', R.zones).addEventListener('click', saveZones);
      App.$('[data-act="zonesCancel"]', R.zones).addEventListener('click', function () {
        zoneTyped = {};
        resetDraft();
        renderZones();
        renderStats();
      });
      syncZoneButtons();
      if (focusBlock) {
        var again = App.$('[data-add="' + focusBlock + '"]', R.zones);
        if (again) {
          again.focus();
          if (keep && keep.id === focusBlock && keep.at !== null && again.setSelectionRange) again.setSelectionRange(keep.at, keep.at);
        }
      }
    }

    function saveZones() {
      if (busy) return;
      var problem = commitTyped();
      if (problem) {
        var e0 = App.$('[data-r="zoneErr"]', R.zones);
        if (e0) e0.textContent = problem;
        return;
      }
      renderZones();
      renderStats();
      if (!draftDirty()) return;
      var ro = readOnlyError();
      if (ro) {
        var e1 = App.$('[data-r="zoneErr"]', R.zones);
        if (e1) e1.textContent = ro.message;
        return;
      }
      var rows = draft.projects.map(function (p) { return { project: p.project, blocks: p.blocks.slice(), color: p.color || '', comment: p.comment || '' }; });
      setBusy(true);
      App.withKey('admin', function (key) { return App.call('api_saveProjects', key, rows); }).then(function (res) {
        setBusy(false);
        App.toast((res && res.message) || 'Zones enregistrées.', 'ok');
        draftBase = JSON.stringify(draft.projects);
        afterWrite();
      }, function (err) {
        setBusy(false);
        renderZones();
        if (err && err.cancelled) return;
        var e = App.$('[data-r="zoneErr"]', R.zones);
        if (e) e.textContent = 'Échec de l’enregistrement : ' + err.message;
        App.toast(err.message, 'error');
      });
    }

    // ---- 3. projects ---------------------------------------------------------------------------------------------
    function renderList() {
      var s = state();
      var stats = {};
      ((s && s.projectsList) || []).forEach(function (p) { stats[App.fold(p.project)] = p; });
      var map = refs();
      var refCount = {};
      Object.keys(map).forEach(function (k) {
        var p = map[k].project;
        if (p) refCount[App.fold(p)] = (refCount[App.fold(p)] || 0) + 1;
      });
      var thr = App.thresholds(s);
      var names = projectNames();
      var saved = {};
      (data ? data.projects : []).forEach(function (p) { saved[App.fold(p.project)] = p; });
      var noneRow = stats[App.fold(App.NO_PROJECT)];
      if (!names.length && !noneRow) {
        R.list.innerHTML = '<div class="empty-note">Aucun projet pour l’instant : collez des références avec un nom de projet (section 1).</div>';
        return;
      }
      R.list.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Projet</th><th>Blocs</th><th class="num">Références</th><th class="num">Palettes EXP2</th>' +
        '<th class="num">En attente</th><th class="num">&gt; ' + esc(App.hText(thr.pendingHoursCrit)) + ' h</th><th></th></tr></thead><tbody>' +
        names.map(function (n) {
          var st = stats[App.fold(n)] || {}, sv = saved[App.fold(n)];
          var blocks = sv ? sv.blocks : (st.blocks || []);
          return '<tr data-project="' + esc(n) + '"><td>' + projTag(s, n) + (sv && sv.listed !== false ? '' : ' <span class="small muted">(absent de l’onglet PROJETS)</span>') + '</td>' +
            '<td>' + (blocks.length ? esc(blocks.join(', ')) : '<span class="warn-t small">aucun bloc</span>') + '</td>' +
            '<td class="num">' + num(refCount[App.fold(n)] || 0) + '</td><td class="num">' + num(st.exp2Pallets || 0) + '</td><td class="num">' + num(st.pendingPallets || 0) + '</td>' +
            '<td class="num">' + (st.pendingCrit ? '<span class="chipd c">' + num(st.pendingCrit) + '</span>' : '0') + '</td>' +
            '<td class="num"><button type="button" class="btn sm" data-rename="' + esc(n) + '">Renommer</button></td></tr>';
        }).join('') +
        (noneRow ? '<tr class="none-row"><td><span class="muted">' + esc(App.NO_PROJECT) + '</span></td><td>' + esc(((noneRow.blocks || []).join(', ')) || 'blocs libres') + '</td><td class="num">' +
          num(noneRow.articles || 0) + '</td><td class="num">' + num(noneRow.exp2Pallets || 0) + '</td><td class="num">' + num(noneRow.pendingPallets || 0) + '</td><td class="num">' +
          (noneRow.pendingCrit ? '<span class="chipd c">' + num(noneRow.pendingCrit) + '</span>' : '0') + '</td><td></td></tr>' : '') +
        '</tbody></table></div><div class="panel-note">Palettes et attentes au dernier calcul. Renommer change aussi le projet des références ; un nom déjà pris fusionne les deux projets.</div>';
      App.$$('[data-rename]', R.list).forEach(function (b) {
        b.addEventListener('click', function () { rename(b.getAttribute('data-rename')); });
      });
    }

    function rename(from) {
      var id = App.uid('rn');
      var body = h('form', { 'class': 'form', autocomplete: 'off' });
      body.innerHTML = '<label class="field"><span>Nouveau nom du projet « ' + esc(from) + ' »</span><input id="' + id + '" list="pj-names" maxlength="40" value="' + esc(from) + '"></label>' +
        '<p class="small" data-r="merge"></p>';
      var inp = null, hint = null;
      var m = App.modal({
        title: 'Renommer un projet',
        body: body,
        actions: [{ label: 'Annuler', kind: 'ghost', value: null }, { label: 'Renommer', kind: 'primary', value: 'ok', submit: true }],
        onAction: function () { return go(); },
        initialFocus: '#' + id
      });
      inp = App.$('#' + id, body);
      hint = App.$('[data-r="merge"]', body);
      function check() {
        var n = normProjectName(inp.value);
        if (n.error) return n.error;
        if (!n.name || n.remove) return 'Saisissez le nouveau nom.';
        return '';
      }
      function target() {
        var n = normProjectName(inp.value).name;
        var other = projectNames().filter(function (x) { return sameName(x, n) && !sameName(x, from); })[0];
        return { name: other || n, merge: !!other };
      }
      inp.addEventListener('input', function () {
        m.setError('');
        var t = target();
        hint.textContent = t.merge ? 'Fusion : les références et les blocs de « ' + from + ' » passent dans le projet existant « ' + t.name + ' ».' : '';
      });
      function go() {
        var problem = check();
        if (problem) {
          m.setError(problem);
          return false;
        }
        var t = target();
        if (t.name === from) return true;
        var ro = readOnlyError();
        if (ro) {
          m.setError(ro.message);
          return false;
        }
        return App.withKey('admin', function (key) { return App.call('api_renameProject', key, from, t.name); }).then(function (res) {
          App.toast((res && res.message) || ('Projet renommé : ' + from + ' → ' + t.name), 'ok');
          afterWrite();
          return true;
        }, function (err) {
          if (err && err.cancelled) return false;
          throw err;
        });
      }
      body.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var r = go();
        if (r === true) m.close('ok');
        else if (r && r.then) {
          m.setBusy(true);
          r.then(function (ok) {
            m.setBusy(false);
            if (ok) m.close('ok');
          }, function (err) {
            m.setBusy(false);
            m.setError(err.message);
          });
        }
      });
    }

    // ---- 4. references without a project --------------------------------------------------------------------------
    function renderNone() {
      var map = refs();
      var hadFocus = document.activeElement && document.activeElement.getAttribute('data-r') === 'noneProject';
      var list = Object.keys(map).map(function (k) { return map[k]; }).filter(function (r) { return r.tracked && !r.project; });
      list.sort(function (a, b) { return ((Number(b.e) || 0) + (Number(b.w) || 0)) - ((Number(a.e) || 0) + (Number(a.w) || 0)) || (a.article < b.article ? -1 : 1); });
      Object.keys(selectedNone).forEach(function (k) { if (!map[k] || map[k].project) delete selectedNone[k]; });
      if (!list.length) {
        R.none.innerHTML = '<div class="empty-note">Toutes les références suivies ont un projet.</div>';
        return;
      }
      var n = Object.keys(selectedNone).length;
      R.none.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="ck"><input type="checkbox" data-all aria-label="Tout sélectionner"' + (n === list.length ? ' checked' : '') + '></th>' +
        '<th>Référence</th><th>Désignation</th><th class="num">Palettes EXP2</th><th class="num">En attente</th><th>Dernier mouvement</th></tr></thead><tbody>' +
        list.map(function (r) {
          var code = normArticle(r.article).code;
          return '<tr><td class="ck"><input type="checkbox" data-pick="' + esc(code) + '"' + (selectedNone[code] ? ' checked' : '') + ' aria-label="Sélectionner ' + esc(r.article) + '"></td>' +
            '<td class="mono">' + esc(r.article) + '</td><td>' + esc(r.designation || '') + '</td><td class="num">' + pal(r.e) + '</td><td class="num">' + pal(r.w) + '</td>' +
            '<td>' + esc(/\d{2}:\d{2}/.test(r.t) ? f.stamp(r.t) : f.date(r.t)) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="actions"><label class="field inline"><span>Affecter à</span><input data-r="noneProject" list="pj-names" maxlength="40" autocomplete="off" placeholder="projet" value="' +
        esc(noneTarget) + '"></label>' +
        '<button type="button" class="btn p" data-save="none"' + (n && !busy ? '' : ' disabled') + '>Affecter (' + n + ')</button><span class="small" data-r="noneErr" role="alert"></span></div>';
      var all = App.$('[data-all]', R.none);
      all.addEventListener('change', function () {
        list.forEach(function (r) {
          var code = normArticle(r.article).code;
          if (all.checked) selectedNone[code] = true;
          else delete selectedNone[code];
        });
        renderNone();
        var x = App.$('[data-all]', R.none);
        if (x) x.focus();
      });
      App.$$('[data-pick]', R.none).forEach(function (c) {
        c.addEventListener('change', function () {
          if (c.checked) selectedNone[c.getAttribute('data-pick')] = true;
          else delete selectedNone[c.getAttribute('data-pick')];
          var k = Object.keys(selectedNone).length;
          var b = App.$('[data-save="none"]', R.none);
          b.textContent = 'Affecter (' + k + ')';
          b.disabled = !k || busy;
          all.checked = k === list.length;
        });
      });
      var inp = App.$('[data-r="noneProject"]', R.none);
      inp.addEventListener('input', function () { noneTarget = inp.value; });
      if (hadFocus) inp.focus();
      function assign() {
        var codes = Object.keys(selectedNone);
        var errEl = App.$('[data-r="noneErr"]', R.none);
        var p = normProjectName(inp.value);
        if (!codes.length) return;
        if (p.error || !p.name) {
          errEl.textContent = p.error || 'Saisissez le projet.';
          inp.focus();
          return;
        }
        var name = canonical(p.name);
        setBusy(true);
        saveRefs(codes.map(function (c) { return { article: c, project: name }; })).then(function (res) {
          setBusy(false);
          selectedNone = {};
          noneTarget = '';
          App.toast('Références affectées à ' + name + ' : ' + resultText(res), res.invalid.length ? 'warn' : 'ok');
          afterWrite();
        }, function (err) {
          setBusy(false);
          renderNone();
          if (err && err.cancelled) return;
          App.toast(err.message, 'error');
        });
      }
      App.$('[data-save="none"]', R.none).addEventListener('click', assign);
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          assign();
        }
      });
    }

    // ---- 5. every reference ------------------------------------------------------------------------------------------
    var MAX_ALL = 300;

    function renderAllFilters() {
      var names = projectNames();
      var cur = allFilter.project;
      R.allProject.innerHTML = '<option value="">Tous les projets</option><option value="__none__">' + esc(App.NO_PROJECT) + '</option>' +

    function renderAllRefs() {
      var map = refs();

      var list = Object.keys(map).map(function (k) { return map[k]; }).filter(function (r) {
        var proj = edits.hasOwnProperty(normArticle(r.article).code) ? edits[normArticle(r.article).code] : r.project;
        if (allFilter.project === '__none__' && proj) return false;
        if (allFilter.project && allFilter.project !== '__none__' && !sameName(proj, allFilter.project)) return false;

        list.slice(0, MAX_ALL).map(function (r) {

          if (proj && !opts.some(function (n) { return sameName(n, proj); })) opts.push(proj);
          return '<tr data-ref="' + esc(code) + '"' + (edits.hasOwnProperty(code) ? ' class="edited"' : '') + '><td class="mono">' + esc(r.article) + '</td><td>' + esc(r.designation || '') + '</td>' +
            '<td><select data-ref-project="' + esc(code) + '" aria-label="Projet de ' + esc(r.article) + '"><option value="">— ' + esc(App.NO_PROJECT) + ' —</option>' +
            opts.map(function (n) { return '<option value="' + esc(n) + '"' + (sameName(n, proj) ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></td>' +
            '<td class="num">' + (r.tracked ? pal(r.e) : '—') + '</td><td class="num">' + (r.tracked ? pal(r.w) : '—') + '</td>' +
            '<td class="num">' + (isNum(r.q) ? num(r.q, undefined) + (r.qs ? '<span class="sub">' + esc(r.qs === 'ARTICLES' ? 'ARTICLES' : 'étiquettes') + '</span>' : '') : '<span class="muted">—</span>') + '</td>' +

      App.$$('[data-ref-project]', R.all).forEach(function (sel) {
        sel.addEventListener('change', function () {

    R.allQ.addEventListener('input', App.debounce(function () {

    R.allProject.addEventListener('change', function () {

      renderAllRefs();

    R.allCancel.addEventListener('click', function () {

    R.allSave.addEventListener('click', function () {
      var rows = Object.keys(edits).map(function (code) { return { article: code, project: edits[code] }; });
      if (!rows.length || busy) return;
      setBusy(true);
      saveRefs(rows).then(function (res) {
        setBusy(false);
        edits = {};
        App.toast('Références enregistrées : ' + resultText(res), res.invalid.length ? 'warn' : 'ok');
        afterWrite();
      }, function (err) {
        setBusy(false);
        updateDirty();
        if (err && err.cancelled) return;
        App.toast(err.message, 'error');
      });
    });

    // ---- render -------------------------------------------------------------------------------------------------------
    function renderAll() {
      renderStatus();
      renderStats();
      renderPreview();
      renderZones();
      renderList();
      renderNone();
      renderAllFilters();
      renderAllRefs();
    }

    function route(p) {
      if (p.article) {
        allFilter.q = String(p.article);

          if (sec && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        }, 0);
      }
    }

    return {
      route: route,

      function sync() {

        ev.preventDefault();

  // ---------------------------------------------------------------------------------------------------------------
  // Import SAP (MB51)
  // ---------------------------------------------------------------------------------------------------------------
  // Fields of a normalised line sent to api_importLines (v1 fields, then the v2 fields of docs/SPEC_V2.md 2.2).
  var LINE_FIELDS = ['article', 'division', 'magasin', 'mvt', 'text', 's', 'doc', 'poste', 'date', 'qty', 'uqs', 'designation', 'user', 'row', 'rank',
    'ts', 'label', 'headerText', 'itemText', 'reference', 'client', 'salesOrder'];

  function decodeText(buf) {
    var bytes = new Uint8Array(buf);
    if (window.TextDecoder) {
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        try {
          return new TextDecoder('windows-1252').decode(bytes);
        } catch (e2) { /* fall through */ }
      }
    }
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return s;
  }

  function readFileBuffer(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('Lecture du fichier impossible : ' + file.name)); };
      r.readAsArrayBuffer(file);
    });
  }

  function isTextFile(name) {
    return /\.(txt|csv|tsv|prn|dat)$/i.test(name);
  }

      ' · heure de saisie ' + (fm.hasTime ? '✓' : '✗') +
      ' · étiquettes ' + (fm.hasLabels ? '✓ (' + num(fm.withLabel) + ')' : '✗');
  }

    function libLine() {

      }

        else if (r) {
